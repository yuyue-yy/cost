/* 预算常用分类 & 频率选项 */
var COMMON_BUDGET_IDS = ['c_food', 'c_trans', 'c_daily', 'c_bath'];
var FREQ_OPTIONS = [
  ['fixed', '固定总额'],
  ['1', '每天'],
  ['2', '每 2 天'],
  ['3', '每 3 天'],
  ['7', '每周'],
  ['period', '本账期一次'],
  ['custom', '每 N 天…']
];

function showBudgetEditor(){
  var p = getActivePeriod();
  if(!p){ toast('请先创建账期'); return; }
  var days = periodDays(p);
  var cats = state.categoriesExpense;

  var selected = {};
  var preset = cats.filter(function(c){ return effectiveBudget(c, days) > 0; }).map(function(c){ return c.id; });
  if(!preset.length){
    preset = COMMON_BUDGET_IDS.filter(function(id){
      return cats.some(function(c){ return c.id === id; });
    });
  }
  preset.forEach(function(id){ selected[id] = true; });

  var ui = null;

  function countSelected(){
    return cats.filter(function(c){ return selected[c.id]; }).length;
  }
  function updateStepInfo(){
    var el = ui.root.querySelector('.wizard-step');
    if(el) el.textContent = '已选 ' + countSelected() + ' 个分类';
  }

  function step1(){
    ui = openWizard({
      center: true,
      title: '设置预算 · 1/2',
      stepInfo: '已选 ' + countSelected() + ' 个分类',
      body:
        '<div class="step-hint"><b>第 1 步：选这个账期要管预算的分类</b><br>' +
          '只勾你真正想控的。没勾的分类不设预算，也不占额度。本期共 ' + days + ' 天。</div>' +
        '<div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap">' +
          '<button type="button" class="btn btn-outline btn-tiny" data-pick="common">勾选常用</button>' +
          '<button type="button" class="btn btn-ghost btn-tiny" data-pick="all">全选</button>' +
          '<button type="button" class="btn btn-ghost btn-tiny" data-pick="none">清空</button>' +
          '<button type="button" class="btn btn-ghost btn-tiny" data-manage="1">管理分类</button>' +
        '</div>' +
        '<div class="cat-grid" id="budgetPick"></div>',
      buttons: [
        { label:'取消', cls:'btn btn-outline', onClick: function(){ closeWizard(); } },
        { label:'下一步 →', cls:'btn btn-primary', onClick: step2 }
      ]
    });

    renderPick();
    Array.prototype.forEach.call(ui.body.querySelectorAll('[data-pick]'), function(btn){
      btn.addEventListener('click', function(){
        var act = btn.getAttribute('data-pick');
        if(act === 'all'){
          cats.forEach(function(c){ selected[c.id] = true; });
        }else if(act === 'none'){
          selected = {};
        }else if(act === 'common'){
          COMMON_BUDGET_IDS.forEach(function(id){
            if(cats.some(function(c){ return c.id === id; })) selected[id] = true;
          });
        }
        renderPick();
        updateStepInfo();
      });
    });

    Array.prototype.forEach.call(ui.body.querySelectorAll('[data-manage]'), function(btn){
      btn.addEventListener('click', function(){
        closeWizard(true);
        showCategoryManager('expense', function(){ showBudgetEditor(); });
      });
    });
  }

  function renderPick(){
    var wrap = ui.body.querySelector('#budgetPick');
    if(!wrap) return;
    wrap.innerHTML = '';
    cats.forEach(function(c){
      var el = document.createElement('div');
      el.className = 'cat-item' + (selected[c.id] ? ' selected' : '');
      el.setAttribute('data-cat', c.id);
      var b = effectiveBudget(c, days);
      el.innerHTML =
        (c.emoji ? '<span class="emoji">' + escapeHtml(c.emoji) + '</span>' : '') +
        escapeHtml(c.name) +
        (b > 0 ? '<span class="badge">' + fmtMoney(b) + '</span>' : '');
      el.addEventListener('click', function(){
        if(selected[c.id]) delete selected[c.id];
        else selected[c.id] = true;
        el.classList.toggle('selected', !!selected[c.id]);
        updateStepInfo();
      });
      wrap.appendChild(el);
    });
  }

  function step2(){
    var picked = cats.filter(function(c){ return selected[c.id]; });
    if(!picked.length){ toast('至少勾选一个分类'); return; }

    ui = openWizard({
      center: true,
      title: '设置预算 · 2/2',
      stepInfo: '本期 ' + days + ' 天',
      body:
        '<div class="budget-sum"><span id="bSum">合计 ¥0.00</span><span id="bCount" class="text-muted"></span></div>' +
        '<div class="step-hint" style="margin-top:10px">填「每次多少钱 + 多久一次」，右边自动算本期预算；' +
          '想直接填一个总数就选「固定总额」。金额留空 = 这个分类不设预算。</div>' +
        '<div id="budgetRows"></div>',
      buttons: [
        { label:'← 上一步', cls:'btn btn-outline', onClick: step1 },
        { label:'保存', cls:'btn btn-primary', onClick: save }
      ]
    });

    var wrap = ui.body.querySelector('#budgetRows');
    picked.forEach(function(c){ wrap.appendChild(buildRow(c)); });
    updateSum();

    function updateSum(){
      var total = 0, filled = 0;
      picked.forEach(function(c){
        var b = effectiveBudget(c, days);
        total += b;
        if(b > 0) filled++;
      });
      var sumEl = ui.body.querySelector('#bSum');
      var cntEl = ui.body.querySelector('#bCount');
      if(sumEl) sumEl.textContent = '合计 ' + fmtMoney(round2(total));
      if(cntEl) cntEl.textContent = '已设 ' + filled + '/' + picked.length + ' 个';
    }

    function buildRow(c){
      var mode = budgetModeOf(c);
      var row = document.createElement('div');
      row.className = 'budget-row';

      var top = document.createElement('div');
      top.className = 'row-top';
      var nm = document.createElement('span');
      nm.textContent = (c.emoji ? c.emoji + ' ' : '') + c.name;
      var calc = document.createElement('span');
      calc.className = 'row-calc';
      top.appendChild(nm);
      top.appendChild(calc);
      row.appendChild(top);

      var box = document.createElement('div');
      box.className = 'row-inputs';

      var amt = document.createElement('input');
      amt.className = 'form-input';
      amt.inputMode = 'decimal';
      amt.placeholder = '金额';
      var pl0 = catPlanOf(c.id);
      var cur = mode === 'periodic' ? Number(pl0.unitPrice) : Number(pl0.budget);
      amt.value = cur > 0 ? cur.toFixed(2) : '';

      var sel = document.createElement('select');
      sel.className = 'form-select';
      FREQ_OPTIONS.forEach(function(o){
        var op = document.createElement('option');
        op.value = o[0];
        op.textContent = o[1];
        sel.appendChild(op);
      });

      var daysInput = document.createElement('input');
      daysInput.className = 'form-input days-input';
      daysInput.inputMode = 'decimal';
      daysInput.placeholder = 'N';

      if(mode === 'fixed'){
        sel.value = 'fixed';
      }else{
        var ev = Number(pl0.everyDays) || 0;
        if(ev === -1 || (ev > 0 && ev === days)) sel.value = 'period';
        else if([1, 2, 3, 7].indexOf(ev) >= 0) sel.value = String(ev);
        else if(ev > 0) sel.value = 'custom';
        else sel.value = '1';
      }
      if(sel.value === 'custom' && Number(pl0.everyDays) > 0) daysInput.value = String(pl0.everyDays);
      daysInput.style.display = sel.value === 'custom' ? '' : 'none';

      box.appendChild(amt);
      box.appendChild(sel);
      box.appendChild(daysInput);
      row.appendChild(box);

      function refresh(){
        var b = effectiveBudget(c, days);
        if(b <= 0){
          calc.textContent = '未设置';
          calc.className = 'row-calc muted';
        }else if(budgetModeOf(c) === 'periodic'){
          calc.textContent = fmtMoney(b) + ' · ' + budgetTimes(c, days) + ' 次';
          calc.className = 'row-calc';
        }else{
          calc.textContent = fmtMoney(b);
          calc.className = 'row-calc';
        }
        updateSum();
      }

      function applyMode(){
        var prev = effectiveBudget(c, days);
        var v = sel.value;
        var pl = catPlanOf(c.id);
        if(v === 'fixed'){
          pl.budgetMode = 'fixed';
          pl.budget = prev > 0 ? prev : parseNum(amt.value);
          if(pl.budget > 0) amt.value = pl.budget.toFixed(2);
        }else{
          pl.budgetMode = 'periodic';
          if(v === 'period'){
            pl.everyDays = -1;
            pl.unitPrice = prev > 0 ? prev : parseNum(amt.value);
            if(pl.unitPrice > 0) amt.value = pl.unitPrice.toFixed(2);
          }else{
            var every = v === 'custom' ? parseNum(daysInput.value) : parseNum(v);
            pl.everyDays = every;
            if(prev > 0 && every > 0 && days > 0){
              pl.unitPrice = round2(prev * every / days);
              amt.value = pl.unitPrice.toFixed(2);
            }else{
              pl.unitPrice = parseNum(amt.value);
            }
          }
        }
        mirrorPlanToCat(c.id);
        daysInput.style.display = v === 'custom' ? '' : 'none';
        refresh();
      }

      amt.addEventListener('input', function(){
        var pl = catPlanOf(c.id);
        if((pl.budgetMode === 'periodic')) pl.unitPrice = parseNum(amt.value);
        else pl.budget = parseNum(amt.value);
        mirrorPlanToCat(c.id);
        refresh();
      });
      sel.addEventListener('change', applyMode);
      daysInput.addEventListener('input', function(){
        catPlanOf(c.id).everyDays = parseNum(daysInput.value);
        mirrorPlanToCat(c.id);
        refresh();
      });

      refresh();
      return row;
    }
  }

  function save(){
    saveAll();
    closeWizard(true);
    toast('预算已保存');
    render();
  }

  step1();
}

/* 图标可选的一组常用 emoji */
var EMOJI_PICK = ['🍜','🍚','🍞','🍰','☕','🥤','🍎','🚌','🚶','🧻','🛍️','💄','📚','🩸','💊','🏥','🎵','💡','🧺','💳','🎁','📈','💰','📋','💵','👦','📦','🏠','✈️','🎮','🐱','⭐'];

function showCategoryManager(type, onDone){
  type = type === 'income' ? 'income' : 'expense';
  var work = {
    expense: state.categoriesExpense.map(function(c){ return Object.assign({}, c); }),
    income: state.categoriesIncome.map(function(c){ return Object.assign({}, c); })
  };
  var ui = null;
  var finished = false;

  function done(){
    if(finished) return;
    finished = true;
    if(typeof onDone === 'function') onDone();
  }

  function renderManager(){
    ui = openWizard({
      center: true,
      title: '分类管理',
      body:
        '<div class="tabs" style="margin-bottom:12px">' +
          '<div class="tab' + (type === 'expense' ? ' active' : '') + '" data-type="expense">支出分类</div>' +
          '<div class="tab' + (type === 'income' ? ' active' : '') + '" data-type="income">收入来源</div>' +
        '</div>' +
        '<div class="step-hint">名字直接改就行；删掉的分类如果下面有历史记录，记录不会消失，只显示为「未分类」，金额仍然计入支出。</div>' +
        '<div id="cmRows"></div>' +
        '<button type="button" class="btn btn-outline btn-block btn-sm mt-8" id="cmAdd">+ 新增' +
          (type === 'income' ? '来源' : '分类') + '</button>' +
        (type === 'expense'
          ? '<button type="button" class="btn btn-outline btn-block btn-sm mt-8" id="cmRestore">↩️ 恢复被删的默认分类</button>'
          : ''),
      buttons: [
        { label:'取消', cls:'btn btn-outline', onClick: function(){ closeWizard(true); done(); } },
        { label:'保存', cls:'btn btn-primary', onClick: save }
      ]
    });

    Array.prototype.forEach.call(ui.body.querySelectorAll('[data-type]'), function(tabEl){
      tabEl.addEventListener('click', function(){
        var t = tabEl.getAttribute('data-type');
        if(t === type) return;
        type = t;
        renderManager();
      });
    });

    renderRows();
    ui.body.querySelector('#cmAdd').addEventListener('click', addRow);
    var restoreBtn = ui.body.querySelector('#cmRestore');
    if(restoreBtn) restoreBtn.addEventListener('click', restoreDefaults);
  }

  /* 把被删掉的默认分类补回来：沿用原来的 id，历史记录和这个分类的预算都会重新接上 */
  function restoreDefaults(){
    var existIds = work.expense.map(function(c){ return c.id; });
    var added = 0;
    DEFAULT_EXPENSE_CATS.forEach(function(dc){
      if(existIds.indexOf(dc.id) >= 0) return;
      work.expense.push(Object.assign({}, dc));
      added++;
    });
    renderRows();
    toast(added ? '补回 ' + added + ' 个默认分类，点「保存」生效' : '默认分类都在，没缺');
  }

  function renderRows(){
    var wrap = ui.body.querySelector('#cmRows');
    if(!wrap) return;
    wrap.innerHTML = '';
    work[type].forEach(function(c, idx){
      var row = document.createElement('div');
      row.className = 'setup-acct';

      if(type === 'expense'){
        var emoji = document.createElement('input');
        emoji.className = 'form-input';
        emoji.maxLength = 4;
        emoji.style.flex = '0 0 54px';
        emoji.style.textAlign = 'center';
        emoji.value = c.emoji || '';
        emoji.addEventListener('input', function(){ c.emoji = emoji.value; });
        emoji.addEventListener('click', function(){
          var old = wrap.querySelector('.emoji-pal');
          if(old) old.remove();
          var box = document.createElement('div');
          box.className = 'emoji-pal';
          EMOJI_PICK.forEach(function(em){
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'emoji-b';
            b.textContent = em;
            b.addEventListener('click', function(){
              c.emoji = em;
              emoji.value = em;
              box.remove();
            });
            box.appendChild(b);
          });
          row.parentNode.insertBefore(box, row.nextSibling);
        });
        row.appendChild(emoji);
      }

      var name = document.createElement('input');
      name.className = 'form-input';
      name.value = c.name || '';
      name.addEventListener('input', function(){ c.name = name.value; });
      row.appendChild(name);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn-ghost btn-tiny text-danger';
      del.textContent = '删';
      del.addEventListener('click', function(){
        if(work[type].length <= 1){ toast('至少保留一个'); return; }
        work[type].splice(idx, 1);
        renderRows();
      });
      row.appendChild(del);
      wrap.appendChild(row);
    });
  }

  function addRow(){
    if(type === 'income'){
      work.income.push({ id: uid('i'), name: '' });
    }else{
      work.expense.push({ id: uid('c'), emoji: '📌', name: '', budget: 0, budgetMode: 'fixed', unitPrice: 0, everyDays: 0 });
    }
    renderRows();
    var rows = ui.body.querySelectorAll('#cmRows .setup-acct');
    var last = rows[rows.length - 1];
    if(!last) return;
    var inputs = last.querySelectorAll('.form-input');
    var nameI = inputs[inputs.length - 1];
    if(nameI) nameI.focus();
  }

  function save(){
    var empty = work[type].filter(function(c){ return !String(c.name || '').trim(); });
    if(empty.length){ toast('还有没填名字的分类，先写上名字'); return; }
    ['expense', 'income'].forEach(function(t){
      work[t].forEach(function(c){
        if(!String(c.name || '').trim()) c.name = '未命名';
      });
    });

    var deleted = [];
    ['expense', 'income'].forEach(function(t){
      var orig = t === 'expense' ? state.categoriesExpense : state.categoriesIncome;
      var ids = work[t].map(function(c){ return c.id; });
      orig.forEach(function(c){ if(ids.indexOf(c.id) < 0) deleted.push(c.id); });
    });

    if(deleted.length){
      var affected = 0;
      state.periods.forEach(function(p){
        (p.records || []).forEach(function(r){ if(deleted.indexOf(r.categoryId) >= 0) affected++; });
      });
      if(affected > 0 && !confirm('被删除的分类下有 ' + affected + ' 笔记录，删除后这些记录会显示为「未分类」（金额仍计入支出）。确定继续吗？')) return;
    }

    state.categoriesExpense = work.expense;
    state.categoriesIncome = work.income;
    /* 分类被删掉时，把指向它的「学过的分法」一起清掉 */
    if(deleted.length) learnedDropCategories(deleted);
    saveAll();
    closeWizard(true);
    toast('分类已更新');
    render();
    done();
  }

  renderManager();
}

function downloadJSON(data, filename){
  var blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function exportPeriod(){
  var p = getActivePeriod(); if(!p){ toast('没有账期'); return; }
  downloadJSON({
    version: 1, type: 'period', period: p, accounts: state.accounts,
    categoriesExpense: state.categoriesExpense, categoriesIncome: state.categoriesIncome
  }, '记账_' + (p.name || p.startDate) + '_' + todayStr() + '.json');
  toast('已导出当前账期');
}

function exportAll(){
  downloadJSON(state, '记账_全部数据_' + todayStr() + '.json');
  toast('已导出全部数据');
}

/* 用分类上带的预算给某个账期补一份预算计划（导入/迁移用）。
 * 已经有了非 0 预算的分类不动 */
function initPlansFromCategories(p, cats){
  if(!p) return;
  p.catPlans = (p.catPlans && typeof p.catPlans === 'object') ? p.catPlans : {};
  (cats || state.categoriesExpense || []).forEach(function(c){
    var old = p.catPlans[c.id];
    var hasVal = old && ((Number(old.budget) || 0) > 0 || (Number(old.unitPrice) || 0) > 0);
    if(hasVal) return;
    p.catPlans[c.id] = {
      budget: round2(c.budget),
      budgetMode: c.budgetMode === 'periodic' ? 'periodic' : 'fixed',
      unitPrice: round2(c.unitPrice),
      everyDays: Number(c.everyDays) || 0
    };
  });
  p.planInit = true;
}

/* 应用「单个账期」的导入数据（导出当前账期得到的 JSON） */
function applyPeriodImport(data){
  if(!data || data.type !== 'period' || !data.period) return false;
  var p = data.period;
  p.openingBalances = p.openingBalances || {};
  p.records = p.records || [];
  var idx = state.periods.findIndex(function(x){ return x.id === p.id; });
  if(idx >= 0) state.periods[idx] = p; else state.periods.push(p);
  /* 账户：账期文件里自带就用自带的，否则用文件里的账户总表抄一份 */
  if(!Array.isArray(p.accounts) || !p.accounts.length){
    var srcAccts = (Array.isArray(data.accounts) && data.accounts.length) ? data.accounts : (state.accounts || []);
    p.accounts = srcAccts.map(function(a){ return { id: a.id, name: a.name }; });
  }
  if(data.accounts) state.accounts = data.accounts;
  if(data.categoriesExpense) state.categoriesExpense = data.categoriesExpense;
  if(data.categoriesIncome) state.categoriesIncome = data.categoriesIncome;
  /* 导入的账期没带预算计划时，用同一份文件里的分类预算补上 */
  if(!p.planInit) initPlansFromCategories(p, state.categoriesExpense);
  activePeriodId = p.id;
  calFocusActive();
  return true;
}

function importJSON(){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', function(){
    var f = input.files && input.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      var data = null;
      try{ data = JSON.parse(String(reader.result)); }
      catch(err){ toast('导入失败：不是有效的 JSON'); return; }
      if(!confirm('导入会覆盖现有数据，确定继续吗？')) return;

      try{
        if(data && data.type === 'period' && data.period){
          applyPeriodImport(data);
        }else if(data && Array.isArray(data.periods)){
          state = ensureStateShape(data);
          activePeriodId = state.activePeriodId || (state.periods[0] && state.periods[0].id) || null;
        }else{
          toast('导入失败：文件格式不认识'); return;
        }
        saveAll();
        closeWizard(true);
        render();
        toast('导入成功');
      }catch(err){
        toast('导入失败：' + err.message);
      }
    };
    reader.readAsText(f);
  });
  input.click();
}

/* 把当前账期里的「收入」记录全部挪成对应账户的期初余额：
 * 总额不变，只是从「本期收入」搬到「期初」，适合导入时把余额当成了进账 */
function incomeToOpening(){
  var p = getActivePeriod();
  if(!p) return null;
  p.openingBalances = p.openingBalances || {};
  var moved = 0;
  var rest = [];
  (p.records || []).forEach(function(r){
    if(r.type !== 'income'){ rest.push(r); return; }
    var acct = r.accountId || defaultAccountId();
    p.openingBalances[acct] = round2(parseNum(p.openingBalances[acct]) + Number(r.amount || 0));
    moved++;
  });
  p.records = rest;
  saveAll();
  return moved;
}

function resetAll(){
  if(!confirm('确定清空所有数据吗？此操作不可恢复！')) return;
  if(!confirm('再确认一次：真的要全部清空吗？')) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  try{ localStorage.removeItem(LEARNED_KEY); }catch(e){}
  closeWizard(true);
  location.reload();
}

    toast('已把 ' + n + ' 笔进账挪成期初');
  });
  document.getElementById('btnRestoreBudget').addEventListener('click', function(){
    var p = getActivePeriod();
    if(!p){ toast('还没有账期'); return; }
    var n = budgetSnapshotCount(p.id);
    if(!n){ toast('这个账簿还没有预算备份'); return; }
    if(!confirm('把当前账簿的预算恢复成上次保存时的样子？现在填的数字会被覆盖。')) return;
    var cnt = restoreBudgetSnapshot();
    if(cnt < 0){ toast('这个账簿还没有预算备份'); return; }
    closeWizard(true);
    render();
    toast('已恢复 ' + cnt + ' 个分类的预算');
  });
  document.getElementById('btnReset').addEventListener('click', resetAll);

  function paintLearned(){
    var wrap = ui.body.querySelector('#setLearned');
    if(!wrap) return;
    var m = learnedReload();
    var keys = Object.keys(m);
    if(!keys.length){
      wrap.innerHTML = '<div class="text-muted" style="font-size:11px">还没有，手动选过分类后会自己长出来</div>';
      return;
    }
    wrap.innerHTML = keys.sort().map(function(k){
      var c = catById(m[k]);
      return '<div class="learn-item" data-lk="' + escapeHtml(k) + '">' +
          '<span class="lw">' + escapeHtml(k) + '</span>' +
          '<span class="lc">→ ' + escapeHtml(c ? c.name : '（已删除的分类）') + '</span>' +
          '<button type="button" class="btn-ghost lx" data-learn-del="' + escapeHtml(k) + '">✕</button>' +
        '</div>';
    }).join('');
  }

  paintLearned();
  ui.body.querySelector('#setLearned').addEventListener('click', function(e){
    var del = e.target && e.target.closest ? e.target.closest('[data-learn-del]') : null;
    if(!del) return;
    learnedRemove(del.getAttribute('data-learn-del'));
    paintLearned();
    toast('已删除这条分法');
  });
}

/* =========================================================
 *  静态事件绑定（只绑一次）
 * ========================================================= */
function bindStatic(){
  document.getElementById('btnPeriod').addEventListener('click', showPeriodManager);
  document.getElementById('btnSettings').addEventListener('click', showSettings);
  document.getElementById('btnManageAcct').addEventListener('click', showAccountEditor);
  document.getElementById('btnBudget').addEventListener('click', showBudgetEditor);
  document.getElementById('btnCatManage').addEventListener('click', function(){ showCategoryManager('expense'); });

  document.getElementById('fabIncome').addEventListener('click', function(){ openRecordWizard('income'); });

  document.getElementById('recordFilter').addEventListener('change', renderRecords);

  /* 明细搜索 */
  var rsEl = document.getElementById('recordSearch');
  var rsTimer = null;
  if(rsEl){
    rsEl.addEventListener('input', function(){
      if(rsTimer) clearTimeout(rsTimer);
      rsTimer = setTimeout(function(){
        recSearch = rsEl.value || '';
        renderRecords();
      }, 300);
    });
    rsEl.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ e.preventDefault(); rsEl.value = ''; recSearch = ''; renderRecords(); }
    });
  }
  var rsClear = document.getElementById('recordSearchClear');
  if(rsClear) rsClear.addEventListener('click', function(){
    if(rsEl) rsEl.value = '';
    recSearch = '';
    renderRecords();
    if(rsEl) rsEl.focus();
  });
  var scopeEl = document.getElementById('recordScope');
  if(scopeEl) scopeEl.addEventListener('change', function(){
    recScope = scopeEl.value === 'all' ? 'all' : 'period';
    renderRecords();
  });

  /* 一句话记账：回车或点「记」直接落库 */
  var quickLine = document.getElementById('quickLine');
  var quickBtn = document.getElementById('btnQuickLine');
  if(quickLine){
    quickLine.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); submitQuickLine(); }
    });
  }
  if(quickBtn) quickBtn.addEventListener('click', submitQuickLine);

  /* 分类卡片：点一下直接记一笔 */
  document.getElementById('categoryList').addEventListener('click', function(e){
    var el = e.target && e.target.closest ? e.target.closest('[data-cat]') : null;
    if(!el) return;
    openQuickWizard('expense', el.getAttribute('data-cat'));
  });

  /* 汇总页已取消：分类汇总折叠进明细页，预算拆解折叠进账户页 */
  var foldCat = document.getElementById('catSummaryFold');
  if(foldCat) foldCat.addEventListener('click', function(e){
    var h = e.target && e.target.closest ? e.target.closest('.fold-head') : null;
    if(!h) return;
    catFoldOpen = !catFoldOpen;
    renderCatSummaryFold();
  });
  var foldBud = document.getElementById('budgetFold');
  if(foldBud) foldBud.addEventListener('click', function(e){
    var h = e.target && e.target.closest ? e.target.closest('.fold-head') : null;
    if(!h) return;
    budgetFoldOpen = !budgetFoldOpen;
    renderBudgetFold();
  });

  /* 日历汇总：上钻 / 下钻 / 口径切换 / 改单笔（全部事件委托） */
  document.getElementById('summaryContent').addEventListener('click', function(e){
    var t = e.target && e.target.closest
      ? e.target.closest('[data-act],[data-scope],[data-calspan],[data-cnav],[data-cal-date],[data-cal-bar],[data-cal-mini],[data-bucket],[data-year-delta],[data-week-delta]')
      : null;
    if(!t) return;

    if(t.getAttribute('data-act') === 'edit'){
      e.stopPropagation();
      editRecord(t.getAttribute('data-id'));
      return;
    }

    var scope = t.getAttribute('data-scope');
    if(scope){
      if(!calView) calView = loadCalView();
      calView.mode = scope === 'month' ? 'month' : 'period';
      if(calView.level === 'day'){ calView.level = 'month'; }
      calView.date = null;
      if(scope === 'month'){
        var cb = calCurrentBucket();
        if(cb) calView.month = calYmd(cb.start).m;
      }
      calEnsure();
      saveCalView();
      renderSummary();
      return;
    }

    if(t.hasAttribute('data-year-delta')){
      calView.year += Number(t.getAttribute('data-year-delta')) || 0;
      calView.periodKey = null;
      calView.date = null;
      if(calView.level === 'day') calView.level = 'month';
      calEnsure();
      saveCalView();
      renderSummary();
      return;
    }

    var span = t.getAttribute('data-calspan');
    if(span){
      if(span === 'week'){
        var cbw = calCurrentBucket();
        var t0 = todayStr();
        var baseW = calView.date || ((cbw && t0 >= cbw.start && t0 <= cbw.end) ? t0 : (cbw ? cbw.start : t0));
        calView.weekStart = calWeekStartOf(baseW);
        calView.level = 'week';
      }else{
        calView.level = 'month';
        calView.date = null;
      }
      calEnsure();
      saveCalView();
      renderSummary();
      return;
    }

    if(t.hasAttribute('data-week-delta')){
      var ws0 = calWeekStartOf(calView.weekStart || calView.date || todayStr());
      ws0 = plusDays(ws0, 7 * (Number(t.getAttribute('data-week-delta')) || 0));
      calView.weekStart = ws0;
      calView.year = calYmd(ws0).y;
      calView.month = calYmd(ws0).m;
      calView.level = 'week';
      calEnsure();
      saveCalView();
      renderSummary();
      return;
    }

    var cnav = t.getAttribute('data-cnav');
    if(cnav){
      if(cnav === 'today'){ calGotoToday(); return; }
      if(cnav === 'week'){
        calView.level = 'week';
        calView.weekStart = calWeekStartOf(calView.date || todayStr());
        calEnsure();
        saveCalView();
        renderSummary();
        return;
      }
      calView.level = cnav === 'year' ? 'year' : 'month';
      calView.date = null;
      calEnsure();
      saveCalView();
      renderSummary();
      return;
    }

    var cd = t.getAttribute('data-cal-date') || t.getAttribute('data-cal-bar');
    if(cd){
      calView.date = cd;
      calView.level = 'day';
      saveCalView();
      renderSummary();
      return;
    }

    var mini = t.getAttribute('data-cal-mini');
    if(mini){ calGotoMonth(Number(mini)); return; }

    var bk = t.getAttribute('data-bucket');
    if(bk){
      calView.periodKey = bk;
      if(calView.mode === 'month') calView.month = Number(String(bk).replace('m', '')) || calView.month;
      calView.level = 'month';
      calView.date = null;
      calEnsure();
      saveCalView();
      renderSummary();
      return;
    }
  });

  /* 明细列表：点整行打开详情（详情里编辑 / 删除）*/
  document.getElementById('recordList').addEventListener('click', function(e){
    var row = e.target && e.target.closest ? e.target.closest('[data-recid]') : null;
    if(!row) return;
    openRecordDetail(row.getAttribute('data-recid'), row.getAttribute('data-recp'));
  });

  /* Tab 切换 */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(tab){
    tab.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      var key = tab.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('.tab-pane'), function(pane){
        pane.classList.toggle('hide', pane.getAttribute('data-pane') !== key);
      });
      if(key === 'calendar'){
        if(!calView) calView = loadCalView();
        renderSummary();
      }
      syncFab(key);
    });
  });

  syncFab('category');
}

/* 只有首页（分类页）留「＋记收入」，其余页不要浮动按钮 */
function syncFab(key){
  var bar = document.querySelector('.fab-bar');
  if(!bar) return;
  bar.style.display = (key === 'category') ? '' : 'none';
}

/* =========================================================
 *  启动
 * ========================================================= */
function init(){
  state = loadState();
  if(!state){
    state = ensureStateShape({ periods: [] });
    saveAll();
  }
  var hasActive = state.periods.some(function(p){ return p.id === state.activePeriodId; });
  activePeriodId = hasActive ? state.activePeriodId : (state.periods[0] ? state.periods[0].id : null);
  state.activePeriodId = activePeriodId;
  saveAll();

  summaryMode = loadSummaryMode();
  calView = loadCalView();
  /* 打开页面时日历默认盯住当前账簿，不留在别的账簿的账期上 */
  if(calView.mode === 'period' && activePeriodId && calView.periodKey !== activePeriodId) calFocusActive();

  bindStatic();
  render();

  if(!activePeriodId) openSetupWizard();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}

/* 供自动化测试使用（不影响正常功能） */
window.__ledger = {
  getState: function(){ return state; },
  getActivePeriod: getActivePeriod,
  catPlanOf: catPlanOf,
  mirrorPlanToCat: mirrorPlanToCat,
  setCatPlan: function(catId, obj){
    var pl = catPlanOf(catId);
    if(obj){
      if('budget' in obj) pl.budget = round2(obj.budget);
      if('budgetMode' in obj) pl.budgetMode = obj.budgetMode === 'periodic' ? 'periodic' : 'fixed';
      if('unitPrice' in obj) pl.unitPrice = round2(obj.unitPrice);
      if('everyDays' in obj) pl.everyDays = Number(obj.everyDays) || 0;
    }
    mirrorPlanToCat(catId);
    return pl;
  },
  clearCatPlans: function(){
    var p = getActivePeriod();
    if(p) p.catPlans = {};
    (state.categoriesExpense || []).forEach(function(c){
      c.budget = 0; c.unitPrice = 0; c.everyDays = 0; c.budgetMode = 'fixed';
    });
  },
  switchPeriod: function(pid){
    if(!state.periods.some(function(p){ return p.id === pid; })) return false;
    activePeriodId = pid;
    state.activePeriodId = pid;
    calFocusActive();
    saveAll();
    render();
    return true;
  },
  computePeriodStats: computePeriodStats,
  computeAccountBalance: computeAccountBalance,
  computeBudgetPlan: computeBudgetPlan,
  getBudgetPlan: computeBudgetPlan,
  computeFreeMoney: computeFreeMoney,
  openRecordWizard: openRecordWizard,
  openSetupWizard: openSetupWizard,
  openPeriodForm: openPeriodForm,
  getCalView: function(){ return calView; },
  buildCalBuckets: calBuckets,
  fmtMoney: fmtMoney,
  parseQuickEntries: parseQuickEntries,
  openQuickWizard: openQuickWizard,
  submitQuickLine: submitQuickLine,
  quickSaveEntries: quickSaveEntries,
  lastAccountForCategory: lastAccountForCategory,
  rememberAccount: rememberAccount,
  freqStatus: freqStatus,
  freqStatusText: freqStatusText,
  sumCategorySpent: sumCategorySpent,
  planQuickRecord: planQuickRecord,
  recognizeAll: recognizeAll,
  recognizeText: recognizeText,
  splitSubjectSegments: splitSubjectSegments,
  normSubject: normSubject,
  catAliases: function(){ return CAT_ALIASES; },
  addQuickCategory: addQuickCategory,
  incomeToOpening: incomeToOpening,
  render: render,
  saveAll: saveAll,
  quickFindCategory: quickFindCategory,
  openQuickConfirm: openQuickConfirm,
  openRecordDetail: openRecordDetail,
  learnedAll: learnedAll,
  learnedPut: learnedPut,
  learnedRemove: learnedRemove,
  getRecSearch: function(){ return recSearch; },
  setRecSearch: function(v){ recSearch = String(v || ''); },
  getRecScope: function(){ return recScope; },
  setRecScope: function(v){ recScope = v === 'all' ? 'all' : 'period'; },
  renderRecords: renderRecords,
  renderAll: render,
  rounds: 0
};

})();
