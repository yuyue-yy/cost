var _aliasIndex = null;
var _learnedMem = null;

function catById(id){
  var list = state.categoriesExpense;
  for(var i = 0; i < list.length; i++){ if(list[i].id === id) return list[i]; }
  return null;
}
function aliasIndex(){
  if(_aliasIndex) return _aliasIndex;
  var out = [];
  Object.keys(CAT_ALIASES).forEach(function(catId){
    CAT_ALIASES[catId].forEach(function(k){ out.push({ k:String(k), catId:catId }); });
  });
  /* 长的先试：洗衣液 必须赢过 洗衣 */
  out.sort(function(a, b){ return b.k.length - a.k.length; });
  _aliasIndex = out;
  return out;
}
function loadLearned(){
  try{
    var raw = localStorage.getItem(LEARNED_KEY);
    var o = raw ? JSON.parse(raw) : {};
    return (o && typeof o === 'object') ? o : {};
  }catch(e){ return {}; }
}
function saveLearned(map){
  try{ localStorage.setItem(LEARNED_KEY, JSON.stringify(map || {})); }catch(e){}
}
function learnedAll(){
  if(!_learnedMem) _learnedMem = loadLearned();
  return _learnedMem;
}
function learnedReload(){ _learnedMem = loadLearned(); return _learnedMem; }
function learnedPut(key, catId){
  var k = String(key || '').trim();
  if(!k || !catId) return;
  var m = learnedAll();
  m[k.slice(0, 12)] = catId;
  saveLearned(m);
}
function learnedRemove(key){
  var m = learnedAll();
  delete m[key];
  saveLearned(m);
}
function learnedDropCategories(catIds){
  var m = learnedAll(), changed = false;
  Object.keys(m).forEach(function(k){
    if(catIds.indexOf(m[k]) >= 0){ delete m[k]; changed = true; }
  });
  if(changed) saveLearned(m);
}

/* 去掉金额、标点、空格，剩下的就是「事项」*/
function normSubject(text){
  var s = String(text == null ? '' : text);
  s = s.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 65248); });
  s = s.replace(/[¥￥]/g, '');
  s = s.replace(/[0-9]+(?:\.[0-9]+)?/g, '');
  s = s.replace(/[元块圆]/g, '');
  s = s.replace(/[\s\u00a0，,、\/|｜；;：:。.！!？?（）()【】\[\]"'“”]/g, '');
  return s.trim();
}
function stripVerbPrefix(s){
  return String(s || '').replace(/^(买了|买|吃了|吃|交了|交|充了|充|还了|还|给了|给|付了|付|用了|用)/, '');
}

/* 认出所有可能的分类：{catId, by, hits}
 * by: name 分类名 / learned 学过的 / alias 别名 / conflict 多个不同分类 / none 没认出 */
function recognizeAll(raw){
  var base = normSubject(raw);
  if(!base) return { catId:null, by:'none', hits:[] };
  var variants = [base];
  var sv = stripVerbPrefix(base);
  if(sv && sv !== base) variants.push(sv);

  var cats = state.categoriesExpense;
  var hits = [];
  variants.forEach(function(t){
    if(!t) return;
    /* 1 分类名精确 */
    cats.forEach(function(c){
      if(String(c.name || '').replace(/\s/g, '') === t) hits.push({ catId:c.id, by:'name', tier:4, w:100 });
    });
    /* 2 学过的分法（长的先，精确压过包含）*/
    var lm = learnedAll();
    Object.keys(lm).sort(function(a, b){ return b.length - a.length; }).forEach(function(k){
      if(!k || !catById(lm[k])) return;
      if(t === k) hits.push({ catId:lm[k], by:'learned', tier:3, w:90 + k.length });
      else if(k.length >= 2 && t.indexOf(k) >= 0) hits.push({ catId:lm[k], by:'learned', tier:3, w:40 + k.length });
    });
    /* 3 别名 */
    aliasIndex().forEach(function(a){
      if(!catById(a.catId)) return;
      if(t === a.k) hits.push({ catId:a.catId, by:'alias', tier:2, w:70 + a.k.length });
      else if(a.k.length >= 2 && t.indexOf(a.k) >= 0) hits.push({ catId:a.catId, by:'alias', tier:2, w:20 + a.k.length });
    });
    /* 4 分类名包含在事项里 */
    cats.forEach(function(c){
      var nm = String(c.name || '').replace(/\s/g, '');
      if(nm.length >= 2 && t.indexOf(nm) >= 0) hits.push({ catId:c.id, by:'name', tier:1, w:15 + nm.length });
    });
  });

  var map = {};
  hits.forEach(function(h){
    var cur = map[h.catId];
    if(!cur || h.tier > cur.tier || (h.tier === cur.tier && h.w > cur.w)) map[h.catId] = h;
  });
  var list = Object.keys(map).map(function(id){ return map[id]; });
  if(!list.length) return { catId:null, by:'none', hits:[] };
  /* 只保留最高一档：分类名 > 学过的 > 别名 > 包含，低档的被压掉 */
  var topTier = list.reduce(function(m, h){ return Math.max(m, h.tier); }, 0);
  list = list.filter(function(h){ return h.tier === topTier; })
    .sort(function(a, b){ return b.w - a.w; });
  if(list.length === 1) return { catId:list[0].catId, by:list[0].by, hits:list };
  /* 分数差得够开（「洗衣液」整词命中 73 vs 「洗衣」只是包含 22）就直接取高的；
     只差一点点（「洗衣」「衣服」都是 22）才算真冲突，交给用户选 */
  if(list.length > 1 && list[0].w - list[1].w >= 10) return { catId:list[0].catId, by:list[0].by, hits:list };
  return { catId:null, by:'conflict', hits:list };
}

/* 按标点、以及「金额后面的空格」把一句话切成若干「事项」片段
 * 「快餐12 水果12」能切开，「买了 洗衣液」（空格前不是数字）不会被切开 */
function splitSubjectSegments(text){
  var s = String(text == null ? '' : text).replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 65248); });
  s = s.replace(/([0-9]+(?:\.[0-9]+)?)\s+/g, '$1|');
  var parts = s.split(/[，,、\/|｜；;。！!？?（）()【】\[\]+~]/)
    .map(function(x){ return x.trim(); })
    .filter(function(x){ return normSubject(x).length > 0; });
  return parts.length ? parts : (normSubject(s) ? [s.trim()] : []);
}

/* 单个片段里的金额（可能没有数字）*/
function segmentAmount(seg){
  var s = String(seg == null ? '' : seg).replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 65248); });
  var nums = s.replace(/[¥￥]/g, '').match(/[0-9]+(?:\.[0-9]+)?/g) || [];
  return round2(nums.reduce(function(a, v){ return a + Number(v || 0); }, 0));
}

/* 逐段识别再汇总：一段认不出、或几段认成不同分类，就都不自动选 */
function recognizeText(raw){
  var segs = splitSubjectSegments(raw);
  if(segs.length <= 1){
    var r1 = recognizeAll(raw);
    return { catId:r1.catId, by:r1.by, hits:r1.hits, segs:segs,
      unknown:(r1.by === 'none' ? segs.slice() : []) };
  }
  var hitsAll = [], solved = [], unknown = [];
  segs.forEach(function(seg){
    var r = recognizeAll(seg);
    (r.hits || []).forEach(function(h){ hitsAll.push(h); });
    if(r.catId) solved.push(r.catId);
    else if(r.by === 'none') unknown.push(seg);
  });
  var map = {};
  hitsAll.forEach(function(h){
    if(!catById(h.catId)) return;
    var cur = map[h.catId];
    if(!cur || h.w > cur.w) map[h.catId] = h;
  });
  var list = Object.keys(map).map(function(id){ return map[id]; });
  var uniq = solved.filter(function(id, i){ return solved.indexOf(id) === i; });

  if(unknown.length) return { catId:null, by:'partial', hits:list, segs:segs, unknown:unknown };
  if(uniq.length === 1) return { catId:uniq[0], by:'multi', hits:list, segs:segs, unknown:[] };
  if(uniq.length > 1) return { catId:null, by:'conflict', hits:list, segs:segs, unknown:[] };
  return { catId:null, by:'none', hits:list, segs:segs, unknown:segs.slice() };
}

/* 一句话 → 记账计划：按分类归组，同组的合并成一笔（各自备注留在组里），
 * 不同分类的各自成一笔。不落库。 */
function planQuickRecord(text){
  var raw = String(text == null ? '' : text).trim();
  var entries = parseQuickEntries(raw, '');
  var normRaw = raw.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 65248); });
  var nums = normRaw.match(/[0-9]+(?:\.[0-9]+)?/g) || [];
  var total = round2(nums.reduce(function(s, v){ return s + Number(v || 0); }, 0));
  if(total <= 0) return { ok:false, reason:'nomoney', raw:raw };

  var segs = splitSubjectSegments(raw);
  var items = segs.map(function(seg){
    var r = recognizeAll(seg);
    return { raw:seg, amount:segmentAmount(seg), catId:r.catId || null,
      by:r.by || 'none', hits:r.hits || [] };
  });

  var groups = [];
  items.forEach(function(it){
    var g = null;
    if(it.catId) groups.forEach(function(x){ if(x.catId === it.catId) g = x; });
    if(!g){
      groups.push({ catId:it.catId, by:it.by, note:'', amount:0, items:[], unknown:[] });
      g = groups[groups.length - 1];
    }
    g.items.push(it);
    g.amount = round2(g.amount + it.amount);
    g.note = g.note ? (g.note + '，' + it.raw) : it.raw;
    if(!it.catId){
      g.unknown.push(it.raw);
      if(g.by === 'none') g.by = it.by;
    }else if(g.by === 'none' || g.by === 'conflict'){
      g.by = it.by;
    }
  });
  /* 整句只有一个总价、某个片段没写数字时，把差额补到第一组 */
  var sumG = round2(groups.reduce(function(s, g){ return s + g.amount; }, 0));
  if(sumG < total && groups.length) groups[0].amount = round2(groups[0].amount + (total - sumG));

  var unknown = [];
  groups.forEach(function(g){ g.unknown.forEach(function(u){ unknown.push(u); }); });
  var hits = [];
  items.forEach(function(it){ it.hits.forEach(function(h){ hits.push(h); }); });
  var catId = groups.length === 1 ? groups[0].catId : null;
  var by = groups.length === 1 ? groups[0].by
    : (unknown.length ? 'partial' : 'conflict');

  var learnKeys = [normSubject(raw)];
  unknown.forEach(function(u){
    var k = normSubject(u);
    if(k && learnKeys.indexOf(k) < 0) learnKeys.push(k);
  });

  return {
    ok:true, raw:raw, amount:total, entries:entries, groups:groups,
    catId:catId, by:by, hits:hits, segments:segs, unknown:unknown,
    learnKey:normSubject(raw), learnKeys:learnKeys
  };
}

/* 名字对不上已有分类时兜底：支出进「额外支出」、收入进「其他收入」，
 * 不再把「快餐」这种别名单独立成新分类（要新分类请去确认窗里点「＋ 新建分类」）*/
function quickEnsureCategory(name, type){
  var hit = quickFindCategory(name, type);
  if(hit) return hit;
  var nm = String(name || '').trim();
  var list = type === 'income' ? state.categoriesIncome : state.categoriesExpense;
  var fallbackName = type === 'income' ? '其他收入' : '额外支出';
  for(var i = 0; i < list.length; i++){
    if(String(list[i].name).trim() === fallbackName) return list[i];
  }
  var cat = type === 'income'
    ? { id:uid('i'), name: fallbackName }
    : { id:uid('c'), emoji: nm ? '📌' : '📦', name: fallbackName, budget:0, budgetMode:'fixed', unitPrice:0, everyDays:0 };
  list.push(cat);
  return cat;
}

/* 一句话里点「＋ 新建分类」时用：同名已有就复用，没有就真的建一个并落库 */
function addQuickCategory(name){
  var nm = String(name || '').trim();
  if(!nm) return null;
  for(var i = 0; i < state.categoriesExpense.length; i++){
    if(String(state.categoriesExpense[i].name || '').trim() === nm) return state.categoriesExpense[i];
  }
  var cat = { id:uid('c'), emoji:'📌', name:nm, budget:0, budgetMode:'fixed', unitPrice:0, everyDays:0 };
  state.categoriesExpense.push(cat);
  saveAll();
  return cat;
}

/* fixedCatId：从某个分类卡片点进来时，写进去的账一律算这个分类，
 * 输入里的名字只当备注，绝不另建分类 */
function quickSaveEntries(entries, type, accountId, date, fixedCatId){
  var p = getActivePeriod();
  if(!p) return 0;
  var fallback = accountId || defaultAccountId();
  var lastUsed = fallback;

  entries.forEach(function(it){
    var fixedCat = fixedCatId ? catById(fixedCatId) : null;
    var cat = fixedCat || quickEnsureCategory(it.name, type);
    /* 显式指定账户就用它（弹窗里选的那个）；没指定就按分类记忆，再退回上次用的账户 */
    var acct = accountId || lastAccountForCategory(cat.id) || fallback;
    p.records.push({
      id: uid('r'),
      type: type,
      categoryId: cat.id,
      amount: it.amount,
      accountId: acct,
      date: date || todayStr(),
      note: (fixedCat && !it.auto) ? String(it.name || '') : '',
      price: 0,
      qty: 0,
      createdAt: Date.now()
    });
    rememberAccount(cat.id, acct);
    if(acct) lastUsed = acct;
  });

  if(lastUsed) state.lastAccountId = lastUsed;
  saveAll();
  return entries.length;
}

/* 分类页顶部：一句话 → 先弹确认窗，用户确认才落库（一笔，备注=原句） */
function submitQuickLine(){
  var el = document.getElementById('quickLine');
  if(!el) return;
  if(!getActivePeriod()){
    toast('先点右上角 📅 建一个账期');
    return;
  }
  var plan = planQuickRecord(el.value);
  if(!plan.ok){
    toast('没认出金额，写成「快餐12，水果12」这样');
    return;
  }
  openQuickConfirm(plan);
}

/* 确认弹窗：分类 / 金额 / 备注 / 账户 / 日期，全部可改，点「记 1 笔」才写库 */
function openQuickConfirm(plan){
  if(!plan || !plan.ok) return;
  var gs = plan.groups || [];
  if(gs.length > 1) return openQuickConfirmMulti(plan, gs);

  var model = {
    catId: plan.catId || null,
    by: plan.by || 'none',
    userPicked: false,
    unknown: plan.unknown || [],
    amount: round2(plan.amount),
    note: String(plan.raw || ''),
    date: todayStr(),
    acctId: null,
    mode: 'confirm',
    pickedAcct: false
  };
  var initCat = model.catId ? catById(model.catId) : null;
  model.acctId = (initCat ? lastAccountForCategory(initCat.id) : null) || defaultAccountId();

  var ui = openWizard({
    center: true,
    title: '确认记账',
    buttons: [
      { label:'取消', cls:'btn btn-outline', onClick: function(){ closeWizard(); } },
      { label:'记 1 笔', cls:'btn btn-primary', onClick: function(){ doSave(); } }
    ]
  });
  var footBtns = ui.footer.querySelectorAll('button');
  var saveBtn = footBtns[footBtns.length - 1];

  function curCat(){ return model.catId ? catById(model.catId) : null; }

  function tagHtml(){
    if(!curCat()) return '';
    if(model.userPicked || model.by === 'none' || model.by === 'conflict' || model.by === 'partial') return '';
    if(model.by === 'learned') return '<span class="d-tag learn">按上次的选择</span>';
    return '<span class="d-tag">自动识别</span>';
  }

  function acctsHtml(){
    return visibleAccounts(getActivePeriod()).map(function(a){
      return '<div class="acct-chip' + (a.id === model.acctId ? ' selected' : '') +
        '" data-acct="' + escapeHtml(a.id) + '">' + escapeHtml(a.name) + '</div>';
    }).join('') || '<div class="text-muted" style="font-size:11px">还没有账户，去「账户」页加一个</div>';
  }

  function confirmBody(){
    var c = curCat();
    var catHtml = c
      ? '<div class="pick-fake set" id="qcPick">' + escapeHtml(c.emoji || '') + ' ' + escapeHtml(c.name) + tagHtml() + '</div>'
      : '<div class="pick-fake" id="qcPick">请选择分类</div>';
    var miss = (!c && model.unknown.length)
      ? '<div class="q-hint">“' + escapeHtml(model.unknown.join('、')) + '”没认出来，选一次就记住了</div>'
      : '';
    return '<div class="form-label">分类</div>' + catHtml + miss +
      '<div class="form-label mt-16">金额</div>' +
      '<input class="form-input amount" id="qcAmount" inputmode="decimal" autocomplete="off" value="' + model.amount.toFixed(2) + '">' +
      '<div class="q-freq" id="qcFreq"></div>' +
      '<div class="form-label mt-16">备注</div>' +
      '<input class="form-input" id="qcNote" autocomplete="off" value="' + escapeHtml(model.note) + '">' +
      '<div class="form-label mt-16">账户</div>' +
      '<div class="q-hint" id="qcAcctHint" style="margin:-4px 0 7px"></div>' +
      '<div class="acct-chips" id="qcAccts">' + acctsHtml() + '</div>' +
      '<div class="form-label mt-12">日期</div>' +
      '<div class="q-date-row"><input class="form-input" type="date" id="qcDate" value="' + model.date + '">' +
        '<button type="button" class="btn-ghost btn-sm" id="qcToday">今天</button></div>';
  }

  function pickBody(){
    return '<div class="q-hint" style="margin:0 0 8px">选一个分类。这次手动选的会被记住，下次同样的事项自动用它。</div>' +
      '<input class="form-input" id="qcCatSearch" autocomplete="off" placeholder="搜索分类" style="margin-bottom:10px">' +
      '<div class="cat-grid" id="qcCatGrid">' + catTiles('') + '</div>' +
      '<div class="qc-newcat" id="qcNewCatWrap">' +
        '<button type="button" class="btn btn-outline btn-block btn-sm" id="qcNewCat">＋ 新建分类</button>' +
      '</div>' +
      '<button type="button" class="btn btn-ghost btn-sm mt-12" id="qcPickBack">← 返回</button>';
  }

  /* 「＋ 新建分类」：就地输入名字，建好直接选中这一笔 */
  function bindNewCat(){
    var btn = ui.body.querySelector('#qcNewCat');
    var wrap = ui.body.querySelector('#qcNewCatWrap');
    if(!btn || !wrap) return;
    btn.addEventListener('click', function(){
      wrap.innerHTML = '<input class="form-input" id="qcNewName" autocomplete="off" placeholder="分类名，比如 快递">' +
        '<div class="q-newcat-btns">' +
          '<button type="button" class="btn btn-outline btn-sm" id="qcNewCancel">取消</button>' +
          '<button type="button" class="btn btn-primary btn-sm" id="qcNewOk">建好并选中</button>' +
        '</div>';
      var nameI = wrap.querySelector('#qcNewName');
      if(nameI) nameI.focus();
      wrap.querySelector('#qcNewCancel').addEventListener('click', paint);
      var okBtn = wrap.querySelector('#qcNewOk');
      okBtn.addEventListener('click', function(){
        var nm = nameI ? String(nameI.value || '').trim() : '';
        if(!nm){ toast('先写个分类名'); return; }
        var cat = addQuickCategory(nm);
        if(!cat) return;
        pickForCurrent(cat.id, true);
        render();
        model.mode = 'confirm';
        paint();
        toast('已新建分类 · ' + cat.name);
      });
      if(nameI) nameI.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); okBtn.click(); }
      });
    });
  }

  /* 选中某个分类（isNew = 刚建出来的，也算手动选） */
  function pickForCurrent(catId, isNew){
    var prevCat = curCat();
    model.catId = catId;
    model.userPicked = true;
    if(!model.pickedAcct){
      var memo = lastAccountForCategory(catId);
      if(memo) model.acctId = memo;
      else if(!prevCat) model.acctId = model.acctId || defaultAccountId();
    }
  }

  function catTiles(kw){
    var k = String(kw || '').trim();
    return state.categoriesExpense.filter(function(c){
      return !k || String(c.name).indexOf(k) >= 0 || String(c.emoji || '').indexOf(k) >= 0;
    }).map(function(c){
      return '<div class="cat-item' + (c.id === model.catId ? ' selected' : '') + '" data-qcat="' + escapeHtml(c.id) + '">' +
        '<span class="emoji">' + escapeHtml(c.emoji || '📌') + '</span>' + escapeHtml(c.name) + '</div>';
    }).join('');
  }

  function paintAcctHint(){
    var el = ui.body.querySelector('#qcAcctHint');
    if(!el) return;
    var a = acctById(model.acctId);
    el.textContent = a ? ('当前：' + a.name + '，点一下可以换') : '';
  }

  /* 频率预算提示：今天/这一次还能花多少 */
  function paintFreq(){
    var el = ui.body.querySelector('#qcFreq');
    if(!el) return;
    var c = curCat();
    if(!c){ el.textContent = ''; el.className = 'q-freq'; return; }
    var st = freqStatus(c, model.date);
    if(!st || st.before || st.after){ el.textContent = ''; el.className = 'q-freq'; return; }
    var amt = round2(parseNum(model.amount));
    var avail = round2(st.available - amt);
    var word = (Number(st.every) === 1) ? '今天' : '这一次';
    var txt;
    if(amt <= 0){
      txt = word + '预算 ' + fmtMoney(st.unit) +
        (st.carry > 0 ? '，含攒下 ' + fmtMoney(st.carry) : '') +
        '，还能花 ' + fmtMoney(Math.max(0, avail));
    }else{
      txt = word + '已花 ' + fmtMoney(round2(st.spentSeg + amt)) +
        (avail < 0 ? '，超了 ' + fmtMoney(-avail) : '，还能花 ' + fmtMoney(avail));
    }
    el.textContent = txt;
    el.className = 'q-freq' + (avail < 0 ? ' over' : '');
  }

  function refreshSaveBtn(){
    var c = curCat();
    var amt = round2(parseNum(model.amount));
    var ok = !!c && amt > 0;
    saveBtn.textContent = '记 1 笔';
    saveBtn.disabled = !ok;
    saveBtn.style.opacity = ok ? '' : '.55';
  }

  function bindConfirm(){
    var pick = ui.body.querySelector('#qcPick');
    if(pick) pick.addEventListener('click', function(){
      model.mode = 'pick';
      paint();
    });

    var amtEl = ui.body.querySelector('#qcAmount');
    if(amtEl){
      amtEl.addEventListener('input', function(){
        model.amount = parseNum(amtEl.value);
        paintFreq();
        refreshSaveBtn();
      });
      amtEl.addEventListener('blur', function(){
        var v = round2(parseNum(amtEl.value));
        model.amount = v;
        amtEl.value = v ? v.toFixed(2) : '';
        paintFreq();
        refreshSaveBtn();
      });
    }

    var noteEl = ui.body.querySelector('#qcNote');
    if(noteEl) noteEl.addEventListener('input', function(){ model.note = noteEl.value; });

    var accts = ui.body.querySelector('#qcAccts');
    if(accts) accts.addEventListener('click', function(e){
      var chip = e.target && e.target.closest ? e.target.closest('[data-acct]') : null;
      if(!chip) return;
      model.acctId = chip.getAttribute('data-acct');
      model.pickedAcct = true;
      Array.prototype.forEach.call(accts.querySelectorAll('.acct-chip'), function(el){
        el.classList.toggle('selected', el === chip);
      });
      /* 存下这次的选择：这个分类下次默认用这家 */
      if(model.catId){ rememberAccount(model.catId, model.acctId); saveAll(); }
      paintAcctHint();
    });

    var dateEl = ui.body.querySelector('#qcDate');
    if(dateEl) dateEl.addEventListener('change', function(){
      if(dateEl.value) model.date = dateEl.value;
      paintFreq();
    });
    var todayBtn = ui.body.querySelector('#qcToday');
    if(todayBtn) todayBtn.addEventListener('click', function(){
      model.date = todayStr();
      if(dateEl) dateEl.value = model.date;
      paintFreq();
    });

    paintAcctHint();
    paintFreq();
    refreshSaveBtn();
  }

  function bindPick(){
    var back = ui.body.querySelector('#qcPickBack');
    if(back) back.addEventListener('click', function(){
      model.mode = 'confirm';
      paint();
    });
    var search = ui.body.querySelector('#qcCatSearch');
    var grid = ui.body.querySelector('#qcCatGrid');
    if(grid) grid.addEventListener('click', function(e){
      var tile = e.target && e.target.closest ? e.target.closest('[data-qcat]') : null;
      if(!tile) return;
      pickForCurrent(tile.getAttribute('data-qcat'));
      model.mode = 'confirm';
      paint();
    });
    if(search) search.addEventListener('input', function(){
      if(grid) grid.innerHTML = catTiles(search.value);
    });
    bindNewCat();
  }

  function paint(){
    ui.body.innerHTML = model.mode === 'pick' ? pickBody() : confirmBody();
    if(model.mode === 'pick') bindPick();
    else bindConfirm();
    var search = ui.body.querySelector('#qcCatSearch');
    if(search) setTimeout(function(){ search.focus(); }, 20);
  }

  function doSave(){
    var c = curCat();
    var amt = round2(parseNum(model.amount));
    if(!c){ toast('先选个分类'); return; }
    if(amt <= 0){ toast('金额要大于 0'); return; }
    var p = getActivePeriod();
    if(!p){ toast('先建一个账期'); return; }
    var acct = model.acctId || defaultAccountId();
    p.records.push({
      id: uid('r'),
      type: 'expense',
      categoryId: c.id,
      amount: amt,
      accountId: acct,
      date: model.date || todayStr(),
      note: String(model.note || '').trim(),
      price: 0, qty: 0,
      createdAt: Date.now()
    });
    rememberAccount(c.id, acct);
    if(acct) state.lastAccountId = acct;
    /* 手动选过分类 → 记住这个分法，下次自动选中 */
    if(model.userPicked){
      var keys = (plan.learnKeys && plan.learnKeys.length) ? plan.learnKeys : [plan.learnKey];
      keys.forEach(function(k){
        var clean = String(k || '').trim();
        if(clean && clean.length >= 2 && clean.length <= 12) learnedPut(clean, c.id);
      });
    }
    saveAll();
    saveBtn.disabled = true;
    closeWizard(true);
    var line = document.getElementById('quickLine');
    if(line) line.value = '';
    render();
    toast('已记 1 笔 · ' + fmtMoney(amt));
  }

  paint();
}

/* 一句话里跨了多个分类 → 拆成 N 笔，同一个分类的合并成一笔（备注里留着各自的事项）
 * 每笔的分类/金额/备注都能改，账户和日期一起选，点「记 N 笔」一次落库 */
function openQuickConfirmMulti(plan, groups){
  var scanGroups = groups.map(function(g){
    return {
      catId: g.catId || null,
      by: g.by || 'none',
      note: String(g.note || ''),
      amount: round2(g.amount),
      userPicked: false,
      items: g.items || [],
      unknown: g.unknown || [],
      acctId: null,
      pickedAcct: false
    };
  });
  var model = {
    groups: scanGroups,
    date: todayStr(),
    mode: 'confirm',
    editIdx: 0
  };
  /* 每笔默认用它那个分类上次用的账户，没有就退回上次用的/默认账户 */
  scanGroups.forEach(function(g){
    g.acctId = (g.catId ? lastAccountForCategory(g.catId) : null) || defaultAccountId();
  });
  var n = scanGroups.length;

  var ui = openWizard({
    center: true,
    title: '确认记账',
    buttons: [
      { label:'取消', cls:'btn btn-outline', onClick: function(){ closeWizard(); } },
      { label:'记 ' + n + ' 笔', cls:'btn btn-primary', onClick: function(){ doSave(); } }
    ]
  });
  var footBtns = ui.footer.querySelectorAll('button');
  var saveBtn = footBtns[footBtns.length - 1];

  function catOf(i){ return model.groups[i].catId ? catById(model.groups[i].catId) : null; }

  function tagOf(i){
    var g = model.groups[i];
    if(!catOf(i)) return '';
    if(g.userPicked || g.by === 'none' || g.by === 'conflict' || g.by === 'partial') return '';
    if(g.by === 'learned') return '<span class="d-tag learn">按上次的选择</span>';
    return '<span class="d-tag">自动识别</span>';
  }

  function chipsHtml(i){
    var g = model.groups[i];
    return visibleAccounts(getActivePeriod()).map(function(a){
      return '<div class="acct-chip' + (a.id === g.acctId ? ' selected' : '') +
        '" data-acct="' + escapeHtml(a.id) + '">' + escapeHtml(a.name) + '</div>';
    }).join('') || '<div class="text-muted" style="font-size:11px">还没有账户，去「账户」页加一个</div>';
  }

  function groupHtml(i){
    var g = model.groups[i];
    var c = catOf(i);
    var head = '<div class="q-g-head"><span class="q-g-no">' + (i + 1) + '</span>第 ' +
      (i + 1) + ' 笔' + tagOf(i) + '</div>';
    var pick = c
      ? '<div class="pick-fake set" data-gpick="' + i + '">' + escapeHtml(c.emoji || '') + ' ' + escapeHtml(c.name) + '</div>'
      : '<div class="pick-fake" data-gpick="' + i + '">请选择分类</div>';
    var miss = (!c && g.unknown.length)
      ? '<div class="q-hint">“' + escapeHtml(g.unknown.join('、')) + '”没认出来，选一次就记住了</div>'
      : '';
    return '<div class="q-group" data-g="' + i + '">' + head + pick + miss +
      '<div class="q-g-row"><span>金额</span><input class="form-input amount" data-gamt="' + i +
        '" inputmode="decimal" autocomplete="off" value="' + (g.amount ? g.amount.toFixed(2) : '') + '"></div>' +
      '<div class="q-g-row"><span>备注</span><input class="form-input" data-gnote="' + i +
        '" autocomplete="off" value="' + escapeHtml(g.note) + '"></div>' +
      '<div class="q-g-lb">这一笔从哪花</div>' +
      '<div class="acct-chips q-gacct" data-gacct="' + i + '">' + chipsHtml(i) + '</div>' +
      '</div>';
  }


  function tailHtml(){
    return '<div class="form-label mt-12">日期</div>' +
      '<div class="q-date-row"><input class="form-input" type="date" id="qcDate" value="' + model.date + '">' +
        '<button type="button" class="btn-ghost btn-sm" id="qcToday">今天</button></div>';
  }

  function confirmBody(){
    var total = round2(model.groups.reduce(function(s, g){ return s + round2(parseNum(g.amount)); }, 0));
    var needPick = model.groups.filter(function(g){ return !g.catId; }).length;
    var tip = needPick
      ? needPick + ' 笔还没定分类，点一下「请选择分类」选好就能记'
      : '合计 ' + fmtMoney(total) + '，按分类拆成 ' + n + ' 笔';
    return '<div class="q-hint" style="margin:0 0 10px">' + tip + '</div>' +
      model.groups.map(function(g, i){ return groupHtml(i); }).join('') +
      tailHtml();
  }

  function pickBody(){
    var i = model.editIdx;
    return '<div class="q-hint" style="margin:0 0 8px">选第 ' + (i + 1) + ' 笔的分类。手动选的会被记住，下次同样的事项自动用它。</div>' +
      '<input class="form-input" id="qcCatSearch" autocomplete="off" placeholder="搜索分类" style="margin-bottom:10px">' +
      '<div class="cat-grid" id="qcCatGrid">' + catTiles('', i) + '</div>' +
      '<div class="qc-newcat" id="qcNewCatWrap">' +
        '<button type="button" class="btn btn-outline btn-block btn-sm" id="qcNewCat">＋ 新建分类</button>' +
      '</div>' +
      '<button type="button" class="btn btn-ghost btn-sm mt-12" id="qcPickBack">← 返回</button>';
  }

  function bindNewCatFor(applyId){
    var btn = ui.body.querySelector('#qcNewCat');
    var wrap = ui.body.querySelector('#qcNewCatWrap');
    if(!btn || !wrap) return;
    btn.addEventListener('click', function(){
      wrap.innerHTML = '<input class="form-input" id="qcNewName" autocomplete="off" placeholder="分类名，比如 快递">' +
        '<div class="q-newcat-btns">' +
          '<button type="button" class="btn btn-outline btn-sm" id="qcNewCancel">取消</button>' +
          '<button type="button" class="btn btn-primary btn-sm" id="qcNewOk">建好并选中</button>' +
        '</div>';
      var nameI = wrap.querySelector('#qcNewName');
      if(nameI) nameI.focus();
      wrap.querySelector('#qcNewCancel').addEventListener('click', paint);
      var okBtn = wrap.querySelector('#qcNewOk');
      okBtn.addEventListener('click', function(){
        var nm = nameI ? String(nameI.value || '').trim() : '';
        if(!nm){ toast('先写个分类名'); return; }
        var cat = addQuickCategory(nm);
        if(!cat) return;
        applyId(cat);
        render();
        model.mode = 'confirm';
        paint();
        toast('已新建分类 · ' + cat.name);
      });
      if(nameI) nameI.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); okBtn.click(); }
      });
    });
  }

  function catTiles(kw, i){
    var k = String(kw || '').trim();
    var cur = model.groups[i || 0].catId;
    return state.categoriesExpense.filter(function(c){
      return !k || String(c.name).indexOf(k) >= 0 || String(c.emoji || '').indexOf(k) >= 0;
    }).map(function(c){
      return '<div class="cat-item' + (c.id === cur ? ' selected' : '') + '" data-qcat="' + escapeHtml(c.id) + '">' +
        '<span class="emoji">' + escapeHtml(c.emoji || '📌') + '</span>' + escapeHtml(c.name) + '</div>';
    }).join('');
  }

  function refreshSaveBtn(){
    var bad = model.groups.filter(function(g){
      return !g.catId || round2(parseNum(g.amount)) <= 0;
    }).length;
    var ok = !bad;
    saveBtn.textContent = '记 ' + n + ' 笔';
    saveBtn.disabled = !ok;
    saveBtn.style.opacity = ok ? '' : '.55';
  }

  function bindConfirm(){
    var body = ui.body;
    body.addEventListener('click', function(e){
      var chip = e.target && e.target.closest ? e.target.closest('[data-gacct] [data-acct]') : null;
      if(chip){
        var wrap = chip.closest('[data-gacct]');
        var i = Number(wrap.getAttribute('data-gacct')) || 0;
        model.groups[i].acctId = chip.getAttribute('data-acct');
        model.groups[i].pickedAcct = true;
        Array.prototype.forEach.call(wrap.querySelectorAll('.acct-chip'), function(el){
          el.classList.toggle('selected', el === chip);
        });
        /* 存下这一笔的选择：该分类下次默认用这家 */
        if(model.groups[i].catId){ rememberAccount(model.groups[i].catId, model.groups[i].acctId); saveAll(); }
        return;
      }
      var pick = e.target && e.target.closest ? e.target.closest('[data-gpick]') : null;
      if(!pick) return;
      model.editIdx = Number(pick.getAttribute('data-gpick')) || 0;
      model.mode = 'pick';
      paint();
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-gamt]'), function(el){
      el.addEventListener('input', function(){
        var i = Number(el.getAttribute('data-gamt')) || 0;
        model.groups[i].amount = parseNum(el.value);
        refreshSaveBtn();
      });
      el.addEventListener('blur', function(){
        var i = Number(el.getAttribute('data-gamt')) || 0;
        var v = round2(parseNum(el.value));
        model.groups[i].amount = v;
        el.value = v ? v.toFixed(2) : '';
        refreshSaveBtn();
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-gnote]'), function(el){
      el.addEventListener('input', function(){
        var i = Number(el.getAttribute('data-gnote')) || 0;
        model.groups[i].note = el.value;
      });
    });
    var dateEl = body.querySelector('#qcDate');
    if(dateEl) dateEl.addEventListener('change', function(){ if(dateEl.value) model.date = dateEl.value; });
    var todayBtn = body.querySelector('#qcToday');
    if(todayBtn) todayBtn.addEventListener('click', function(){
      model.date = todayStr();
      if(dateEl) dateEl.value = model.date;
    });
    refreshSaveBtn();
  }

  function bindPick(){
    var i = model.editIdx;
    var back = ui.body.querySelector('#qcPickBack');
    if(back) back.addEventListener('click', function(){ model.mode = 'confirm'; paint(); });
    var search = ui.body.querySelector('#qcCatSearch');
    var grid = ui.body.querySelector('#qcCatGrid');
    if(grid) grid.addEventListener('click', function(e){
      var tile = e.target && e.target.closest ? e.target.closest('[data-qcat]') : null;
      if(!tile) return;
      var g = model.groups[i];
      g.catId = tile.getAttribute('data-qcat');
      g.userPicked = true;
      /* 这一笔没手动改过账户：跟着新分类的记忆走 */
      if(!g.pickedAcct){
        g.acctId = lastAccountForCategory(g.catId) || g.acctId || defaultAccountId();
      }
      model.mode = 'confirm';
      paint();
    });
    if(search) search.addEventListener('input', function(){
      if(grid) grid.innerHTML = catTiles(search.value, i);
    });
    bindNewCatFor(function(cat){
      var g = model.groups[i];
      g.catId = cat.id;
      g.userPicked = true;
      if(!g.pickedAcct) g.acctId = lastAccountForCategory(cat.id) || g.acctId || defaultAccountId();
    });
  }

  function paint(){
    ui.body.innerHTML = model.mode === 'pick' ? pickBody() : confirmBody();
    if(model.mode === 'pick') bindPick();
    else bindConfirm();
    var search = ui.body.querySelector('#qcCatSearch');
    if(search) setTimeout(function(){ search.focus(); }, 20);
  }

  function doSave(){
    var p = getActivePeriod();
    if(!p){ toast('先建一个账期'); return; }
    for(var i = 0; i < model.groups.length; i++){
      var g = model.groups[i];
      if(!g.catId){ toast('第 ' + (i + 1) + ' 笔还没选分类'); return; }
      if(round2(parseNum(g.amount)) <= 0){ toast('第 ' + (i + 1) + ' 笔金额要大于 0'); return; }
    }
    var saved = 0, total = 0, lastAcct = null;
    model.groups.forEach(function(g){
      var amt = round2(parseNum(g.amount));
      var note = String(g.note || '').trim();
      var acct = g.acctId || defaultAccountId();
      p.records.push({
        id: uid('r'), type:'expense', categoryId: g.catId, amount: amt,
        accountId: acct, date: model.date || todayStr(), note: note,
        price: 0, qty: 0, createdAt: Date.now()
      });
      rememberAccount(g.catId, acct);
      lastAcct = acct;
      saved++;
      total = round2(total + amt);
      if(g.userPicked){
        var keys = [];
        var nk = normSubject(note);
        if(nk) keys.push(nk);
        (g.items || []).forEach(function(it){
          var k = normSubject(it.raw);
          if(k) keys.push(k);
        });
        keys.forEach(function(k){
          var clean = String(k || '').trim();
          if(clean && clean.length >= 2 && clean.length <= 12) learnedPut(clean, g.catId);
        });
      }
    });
    if(lastAcct) state.lastAccountId = lastAcct;
    saveAll();
    saveBtn.disabled = true;
    closeWizard(true);
    var line = document.getElementById('quickLine');
    if(line) line.value = '';
    render();
    toast('已记 ' + saved + ' 笔 · ' + fmtMoney(total));
  }

  paint();
}

/* 点分类弹出的小弹窗：一屏搞定，只有金额/账户/日期 */
function openQuickWizard(type, catId){
  type = type === 'income' ? 'income' : 'expense';
  var list = type === 'income' ? state.categoriesIncome : state.categoriesExpense;
  var fixed = null;
  if(catId){
    for(var i = 0; i < list.length; i++){ if(list[i].id === catId){ fixed = list[i]; break; } }
  }
  var fallbackName = fixed ? String(fixed.name) : '';
  var dateVal = todayStr();
  /* 默认账户：这个分类上次用的那个；没有就沿用全局上次用的 */
  var memoId = fixed ? lastAccountForCategory(fixed.id) : null;
  var acctId = memoId || defaultAccountId();
  var userPickedAcct = false;
  var entries = [];
  var saveBtn = null;

  var accts = visibleAccounts(getActivePeriod()).map(function(a){
    return '<div class="acct-chip' + (a.id === acctId ? ' selected' : '') + '" data-acct="' + escapeHtml(a.id) + '">' +
        escapeHtml(a.name) + '</div>';
  }).join('') || '<div class="text-muted">还没有账户，去「账户」页加一个</div>';

  var ui = openWizard({
    center: true,
    title: fixed ? ('记一笔 · ' + (fixed.emoji || '') + fixed.name)
                 : ('快速记' + (type === 'income' ? '收入' : '支出')),
    body:
      '<input class="q-input" id="q_input" autocomplete="off" placeholder="' +
        (fixed ? '只填金额，如 12；多笔写 12 20' : '快餐12，水果12') + '">' +
      '<div class="q-hint" id="q_hint">' +
        (fixed ? '金额可以直接写，也能连写几笔' : '分类名 + 金额，用空格、逗号或斜杠分开') +
      '</div>' +
      '<div class="q-freq" id="q_freq"></div>' +
      '<div class="q-preview" id="q_preview"></div>' +
      '<div class="form-label mt-16">账户</div>' +
      '<div class="q-hint" id="q_acctHint" style="margin:-4px 0 7px"></div>' +
      '<div class="acct-chips" id="q_accts">' + accts + '</div>' +
      '<div class="form-label mt-12">日期</div>' +
      '<div class="q-date-row"><input class="form-input" type="date" id="q_date" value="' + dateVal + '">' +
        '<button type="button" class="btn-ghost btn-sm" id="q_today">今天</button></div>',
    buttons: [
      { label:'分步填写', cls:'btn btn-ghost btn-sm', onClick:function(){
          closeWizard(true);
          openRecordWizard(type, null, fixed ? fixed.id : null);
        } },
      { label:'取消', cls:'btn btn-outline', onClick:function(){ closeWizard(); } },
      { label:'记 0 笔', cls:'btn btn-primary', onClick:function(){ doSave(); } }
    ]
  });

  saveBtn = ui.footer.querySelectorAll('button');
  saveBtn = saveBtn[saveBtn.length - 1];

  ui.body.querySelector('#q_accts').addEventListener('click', function(e){
    var chip = e.target && e.target.closest ? e.target.closest('[data-acct]') : null;
    if(!chip) return;
    acctId = chip.getAttribute('data-acct');
    userPickedAcct = true;
    Array.prototype.forEach.call(this.querySelectorAll('.acct-chip'), function(c){
      c.classList.toggle('selected', c === chip);
    });
    /* 选了就记住：下次从同一个分类进来，直接预选这家 */
    if(fixed && acctId){ rememberAccount(fixed.id, acctId); saveAll(); }
    paintAcctHint();
  });

  function paintAccts(){
    var wrap = ui.body.querySelector('#q_accts');
    if(!wrap) return;
    Array.prototype.forEach.call(wrap.querySelectorAll('.acct-chip'), function(c){
      c.classList.toggle('selected', c.getAttribute('data-acct') === acctId);
    });
    paintAcctHint();
  }

  function paintAcctHint(){
    var el = ui.body.querySelector('#q_acctHint');
    if(!el) return;
    var acct = acctById(acctId);
    if(!acct){ el.textContent = ''; return; }
    el.textContent = memoId && acctId === memoId
      ? '默认用上次「' + (fixed ? fixed.name : '这个分类') + '」的账户，点一下可以换'
      : (acct.name ? '当前：' + acct.name + '，点一下可以换' : '');
  }

  ui.body.querySelector('#q_today').addEventListener('click', function(){
    var d = ui.body.querySelector('#q_date');
    d.value = todayStr();
    dateVal = todayStr();
    paintFreq();
  });

  var input = ui.body.querySelector('#q_input');
  function refresh(){
    var txt = input.value;
    entries = parseQuickEntries(txt, fallbackName);

    /* 多笔模式：还没手动换账户时，跟着第一个分类的记忆走 */
    if(!userPickedAcct && !fixed && entries.length){
      var c0 = quickFindCategory(entries[0].name, type);
      var m0 = c0 ? lastAccountForCategory(c0.id) : null;
      if(m0 && m0 !== acctId){ acctId = m0; memoId = m0; paintAccts(); }
    }

    var pv = ui.body.querySelector('#q_preview');
    var total = entries.reduce(function(s, it){ return s + it.amount; }, 0);
    var chips = entries.map(function(it){
      var known = quickFindCategory(it.name, type);
      return '<span class="q-chip' + (known ? '' : ' new') + '">' +
          ((known && known.emoji) ? known.emoji + ' ' : '') + escapeHtml(it.name) +
          ' <b>' + fmtMoney(it.amount) + '</b>' +
          (known ? '' : ' · 新') +
        '</span>';
    }).join('');
    pv.innerHTML = chips + (entries.length > 1
        ? '<span class="q-total">共 ' + entries.length + ' 笔 · ' + fmtMoney(total) + '</span>'
        : '');
    saveBtn.textContent = '记 ' + entries.length + ' 笔';
    saveBtn.disabled = entries.length === 0;
    saveBtn.style.opacity = entries.length ? '' : '.55';
    paintFreq();
  }

  /* 频率预算：输入框下面实时提示「这一次还能花多少」 */
  function paintFreq(){
    var el = ui.body.querySelector('#q_freq');
    if(!el) return;
    if(!fixed){ el.textContent = ''; el.className = 'q-freq'; return; }
    var dEl = ui.body.querySelector('#q_date');
    var d = (dEl && dEl.value) || todayStr();
    var st = freqStatus(fixed, d);
    if(!st || st.before || st.after){ el.textContent = ''; el.className = 'q-freq'; return; }
    var typed = entries.reduce(function(s, it){ return s + Number(it.amount || 0); }, 0);
    var avail = round2(st.available - typed);
    var word = (Number(st.every) === 1) ? '今天' : '这一次';
    var txt;
    if(typed <= 0){
      txt = word + '预算 ' + fmtMoney(st.unit) +
        (st.carry > 0 ? '，含攒下 ' + fmtMoney(st.carry) : '') +
        '，还能花 ' + fmtMoney(Math.max(0, avail));
    }else{
      txt = word + '已花 ' + fmtMoney(round2(st.spentSeg + typed)) +
        (avail < 0 ? '，超了 ' + fmtMoney(-avail) : '，还能花 ' + fmtMoney(avail));
    }
    el.textContent = txt;
    el.className = 'q-freq' + (avail < 0 ? ' over' : '');
  }

  input.addEventListener('input', refresh);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); doSave(); }
  });
  ui.body.querySelector('#q_date').addEventListener('change', paintFreq);

  function doSave(){
    if(!entries.length){ toast('先写金额，比如 12'); return; }
    if(!getActivePeriod()){ toast('先建一个账期'); return; }
    var dEl = ui.body.querySelector('#q_date');
    var d = dEl && dEl.value ? dEl.value : todayStr();
    var n = quickSaveEntries(entries, type, acctId, d, fixed ? fixed.id : null);
    if(!n) return;
    closeWizard(true);
    render();
    toast('已记 ' + n + ' 笔 · ' + fmtMoney(entries.reduce(function(s, it){ return s + it.amount; }, 0)));
  }

  setTimeout(function(){ input.focus(); }, 20);
  refresh();
  paintAcctHint();
}

/* 账户按账簿独立：每个账期自己一份 p.accounts = [{id,name}]，
 * 新增/改名/删除只影响本账簿，别的账簿完全不受影响 */
function accountsOf(p){
  p = p || getActivePeriod();
  if(!p) return (state && state.accounts) || [];
  if(!Array.isArray(p.accounts)){
    var src = (state && state.accounts && state.accounts.length) ? state.accounts : DEFAULT_ACCOUNTS;
    p.accounts = src.map(function(a){ return { id: a.id, name: a.name }; });
  }
  return p.accounts;
}
function acctById(id, p){
  var list = accountsOf(p);
  return list.filter(function(a){ return a.id === id; })[0] || null;
}
/* 兼容旧调用：当前账簿的账户列表 */
function visibleAccounts(p){ return accountsOf(p); }
/* 从指定账簿移除账户（只动这一本） */
function removeAcctFromPeriod(p, aid){
  if(!p) return false;
  var had = accountsOf(p).some(function(a){ return a.id === aid; });
  p.accounts = accountsOf(p).filter(function(a){ return a.id !== aid; });
  if(p.openingBalances) delete p.openingBalances[aid];
  p.records = (p.records || []).filter(function(r){ return r.accountId !== aid; });
  if(state.lastAccountId === aid) state.lastAccountId = (p.accounts[0] || {}).id || null;
  return had;
}

function renderAccounts(){
  var wrap = document.getElementById('accountList');
  var p = getActivePeriod();
  if(!p){ wrap.innerHTML = '<div class="empty">还没有账期</div>'; return; }
  var list = accountsOf(p);
  if(!list.length){ wrap.innerHTML = '<div class="empty">本账期还没有账户，点上方「账户管理」新增</div>'; return; }
  wrap.innerHTML = list.map(function(a){
    var opening = parseNum((p.openingBalances || {})[a.id]);
    var cur = computeAccountBalance(a.id);
    return '<div class="acct-card">' +
        '<div>' +
          '<div class="name">' + escapeHtml(a.name) + '</div>' +
          '<div class="meta">期初 ' + fmtMoney(opening) + '</div>' +
        '</div>' +
        '<div class="bal' + (cur < 0 ? ' text-danger' : '') + '">' + fmtMoney(cur) + '</div>' +
      '</div>';
  }).join('');
}

/* ================= 明细：搜索 + 分组列表 ================= */
var recSearch = '';
var recScope = 'period';

function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function hlText(s, kw){
  var t = escapeHtml(s);
  if(!kw) return t;
  try{
    var re = new RegExp('(' + escRe(escapeHtml(kw)) + ')', 'gi');
    return t.replace(re, '<span class="hl">$1</span>');
  }catch(e){ return t; }
}
function recordPool(){
  if(recScope === 'all'){
    var out = [];
    state.periods.forEach(function(pp){
      (pp.records || []).forEach(function(r){ out.push({ r:r, p:pp }); });
    });
    return out;
  }
  var p = getActivePeriod();
  return p ? (p.records || []).map(function(r){ return { r:r, p:p }; }) : [];
}
function catNameOf(r){
  if(r.type === 'expense'){
    var c = state.categoriesExpense.filter(function(x){ return x.id === r.categoryId; })[0];
    return c ? (String(c.emoji || '') + ' ' + String(c.name)) : '❓ 未分类';
  }
  var ci = state.categoriesIncome.filter(function(x){ return x.id === r.categoryId; })[0];
  return ci ? String(ci.name) : '❓ 未分类';
}
function acctNameById(id, p){
  var a = acctById(id, p || getActivePeriod());
  if(a) return a.name;
  var g = (state.accounts || []).filter(function(x){ return x.id === id; })[0];
  return g ? g.name : '未知账户';
}
function periodTagOf(pp){
  if(!pp) return '';
  return String(pp.startDate || '').slice(5) + '~' + String(pp.endDate || '').slice(5);
}
/* 搜索匹配：分类名、备注、账户、金额、日期 */
function recordMatches(x, kwLower){
  var r = x.r;
  var hay = [
    catNameOf(r),
    String(r.note || ''),
    acctNameById(r.accountId, x.p),
    Number(r.amount || 0).toFixed(2),
    String(r.date || ''),
    periodTagOf(x.p)
  ].join(' ').toLowerCase();
  return hay.indexOf(kwLower) >= 0;
}

function renderRecords(){
  var wrap = document.getElementById('recordList');
  if(!wrap) return;
  var p = getActivePeriod();
  var filterEl = document.getElementById('recordFilter');
  var filter = filterEl ? filterEl.value : 'all';
  var kw = String(recSearch || '').trim();
  var kwLower = kw.toLowerCase();

  var clearBtn = document.getElementById('recordSearchClear');
  if(clearBtn) clearBtn.classList.toggle('hide', !kw);
  var sumEl = document.getElementById('recordSum');

  if(!p){
    wrap.innerHTML = '<div class="empty">还没有账期</div>';
    if(sumEl) sumEl.classList.add('hide');
    return;
  }

  var rows = recordPool().filter(function(x){ return filter === 'all' ? true : x.r.type === filter; });
  if(kw) rows = rows.filter(function(x){ return recordMatches(x, kwLower); });

  var inc = 0, exp = 0;
  rows.forEach(function(x){
    var v = Number(x.r.amount || 0);
    if(x.r.type === 'income') inc += v; else exp += v;
  });

  /* 搜索汇总条：看之前一共花了多少 */
  if(sumEl){
    if(!kw){ sumEl.classList.add('hide'); sumEl.textContent = ''; }
    else{
      sumEl.classList.remove('hide');
      var parts = ['找到 ' + rows.length + ' 笔'];
      if(exp > 0) parts.push('支出 ' + fmtMoney(exp));
      if(inc > 0) parts.push('收入 ' + fmtMoney(inc));
      if(exp > 0 && inc > 0){
        var net = round2(inc - exp);
        parts.push('净 ' + (net < 0 ? '-' : '') + fmtMoney(Math.abs(net)));
      }
      sumEl.textContent = kw ? (parts.join(' · ') + '（关键词「' + kw + '」）') : '';
    }
  }

  if(!rows.length){
    wrap.innerHTML = kw
      ? '<div class="empty">没有匹配「' + escapeHtml(kw) + '」的记录</div>'
      : '<div class="empty">还没有记录，回「分类」页点一下分类就能记</div>';
    renderCatSummaryFold();
    return;
  }

  /* 本期最大的 3 笔支出（少于 3 笔就不标记，免得小题大做） */
  var bigIds = {};
  var expRecs = (p.records || [])
    .filter(function(r){ return r.type === 'expense' && Number(r.amount || 0) > 0; })
    .slice()
    .sort(function(a, b){ return Number(b.amount || 0) - Number(a.amount || 0); });
  if(expRecs.length >= 3){
    expRecs.slice(0, 3).forEach(function(r, i){ bigIds[r.id] = i + 1; });
  }

  var groups = {};
  rows.forEach(function(x){ (groups[x.r.date] = groups[x.r.date] || []).push(x); });

  wrap.innerHTML = Object.keys(groups).sort().reverse().map(function(date){
    var items = groups[date].slice().sort(function(a, b){
      return (b.r.createdAt || 0) - (a.r.createdAt || 0);
    });
    var dayIncome = 0, dayExpense = 0;
    items.forEach(function(x){
      if(x.r.type === 'income') dayIncome += Number(x.r.amount || 0);
      else dayExpense += Number(x.r.amount || 0);
    });
    var dShort = String(date || '').slice(5);
    var dLabel = dShort;
    var dt = new Date(String(date) + 'T00:00:00');
    if(!isNaN(dt.getTime())){
      dLabel = dShort + ' ' + ['周日','周一','周二','周三','周四','周五','周六'][dt.getDay()];
    }
    var dayAmt = [];
    if(dayExpense > 0) dayAmt.push('−' + fmtMoney(dayExpense));
    if(dayIncome > 0) dayAmt.push('+' + fmtMoney(dayIncome));
    return '<div class="date-row"><span>' + dLabel + '</span><span>' + dayAmt.join(' · ') + '</span></div>' +
      items.map(function(x){
        var r = x.r;
        var rank = bigIds[r.id] || 0;
        var dot = rank ? '<span class="dot-mark d' + rank + '" style="display:inline-block;margin-left:6px;vertical-align:2px"></span>' : '';
        var metaBits = [];
        if(recScope === 'all') metaBits.push('<span class="scope-tag">〔' + escapeHtml(periodTagOf(x.p)) + '〕</span>');
        metaBits.push(hlText(acctNameById(r.accountId, x.p), kw));
        if(r.note) metaBits.push(hlText(r.note, kw));
        if(r.price > 0 && r.qty > 0) metaBits.push(r.price + '×' + r.qty);
        return '<div class="list-item' + (rank ? ' big-' + rank : '') + '" data-recid="' + escapeHtml(r.id) +
            '" data-recp="' + escapeHtml(x.p.id) + '">' +
            '<div class="icon">' + (r.type === 'expense' ? '💸' : '💰') + '</div>' +
            '<div class="main">' +
              '<div class="title">' + hlText(catNameOf(r), kw) + dot + '</div>' +
              '<div class="meta">' + metaBits.join(' · ') + '</div>' +
            '</div>' +
            '<div class="amount ' + r.type + '">' + (r.type === 'expense' ? '-' : '+') + fmtMoney(r.amount) + '</div>' +
          '</div>';
      }).join('');
  }).join('');

  renderCatSummaryFold();
}

/* 明细页底部：分类汇总（默认收起）*/
var catFoldOpen = false;
function renderCatSummaryFold(){
  var wrap = document.getElementById('catSummaryFold');
  if(!wrap) return;
  var p = getActivePeriod();
  if(!p){ wrap.innerHTML = ''; return; }
  var s = computePeriodStats();
  var totals = computeCategoryTotals();

  var expenseRows = state.categoriesExpense
    .map(function(c){ return { emoji:c.emoji, name:c.name, spent: totals[c.id] || 0 }; })
    .filter(function(c){ return c.spent > 0; });
  var knownIds = {};
  state.categoriesExpense.forEach(function(c){ knownIds[c.id] = true; });
  var unknownSum = 0;
  Object.keys(totals).forEach(function(id){ if(!knownIds[id]) unknownSum = round2(unknownSum + totals[id]); });
  if(unknownSum > 0) expenseRows.push({ emoji:'❓', name:'未分类', spent: unknownSum });
  expenseRows.sort(function(a, b){ return b.spent - a.spent; });
  var maxSpent = expenseRows.length ? expenseRows[0].spent : 0;

  var incomeMap = {};
  (p.records || []).forEach(function(r){
    if(r.type === 'income') incomeMap[r.categoryId] = round2((incomeMap[r.categoryId] || 0) + Number(r.amount || 0));
  });
  var incomeRows = state.categoriesIncome
    .map(function(c){ return { name:c.name, amount: incomeMap[c.id] || 0 }; })
    .filter(function(c){ return c.amount > 0; })
    .sort(function(a, b){ return b.amount - a.amount; });

  var inner =
    '<div class="fold-sub">支出</div>' +
    (expenseRows.length
      ? expenseRows.map(function(r){
          var pct = maxSpent > 0 ? Math.round(r.spent / maxSpent * 100) : 0;
          return '<div class="fd-row">' +
              '<span class="fd-nm">' + (r.emoji || '') + ' ' + escapeHtml(r.name) + '</span>' +

function deleteRecordFrom(periodId, id){

function renderCategories(){
  var wrap = document.getElementById('categoryList');
  var p = getActivePeriod();
  if(!p){ wrap.innerHTML = '<div class="empty">还没有账期</div>'; return; }
  var totals = computeCategoryTotals();
  var days = periodDays(p);

  /* 全部分类都列出来：按预算用掉的比例从少到多排，快超支的排后面
     没设预算的分类排在最后，之间按花掉的金额从多到少 */
  var items = state.categoriesExpense.slice().sort(function(a, b){
    var ba = effectiveBudget(a, days), bb = effectiveBudget(b, days);
    var ra = ba > 0 ? (totals[a.id] || 0) / ba : null;
    var rb = bb > 0 ? (totals[b.id] || 0) / bb : null;
    if(ra !== null && rb !== null){
      if(Math.abs(ra - rb) > 1e-9) return ra - rb;
      return (totals[b.id] || 0) - (totals[a.id] || 0);
    }
    if(ra !== null) return -1;   /* 有预算的排前面 */
    if(rb !== null) return 1;
    return (totals[b.id] || 0) - (totals[a.id] || 0) ||
      String(a.name).localeCompare(String(b.name));
  });

  /* 分类被删掉后，它下面的历史记录金额归到「未分类」 */
  var knownIds = {};
  state.categoriesExpense.forEach(function(c){ knownIds[c.id] = true; });
  var unknownSum = 0;
  Object.keys(totals).forEach(function(id){ if(!knownIds[id]) unknownSum = round2(unknownSum + totals[id]); });

  if(!items.length && unknownSum <= 0){ wrap.innerHTML = '<div class="empty">还没有支出分类，去「分类管理」加一个</div>'; return; }

  /* 分类占比与最大支出分类 */
  var totalSpent = round2(unknownSum);
  var maxSpent = 0;
  items.forEach(function(c){
    var v = totals[c.id] || 0;
    totalSpent = round2(totalSpent + v);
    maxSpent = Math.max(maxSpent, v);
  });

  var html = items.map(function(c){
    var spent = totals[c.id] || 0;
    var budget = effectiveBudget(c, days);
    var pct = budget > 0 ? Math.min(100, spent / budget * 100) : 0;
    var over = budget > 0 && spent > budget;
    var share = totalSpent > 0 ? Math.round(spent / totalSpent * 100) : 0;
    var isTop = spent > 0 && spent === maxSpent;
    var note = '';
    if(budget > 0){
      if(budgetModeOf(c) === 'periodic'){
        var pl = catPlanOf(c.id);
        note = fmtMoney(pl.unitPrice) + ' × ' + budgetTimes(c, days) + ' 次';
        note += (Number(pl.everyDays) === -1)
          ? '（本账期一次）'
          : (Number(pl.everyDays) === 1
              ? '（每天 × ' + days + ' 天）'
              : '（每 ' + pl.everyDays + ' 天一次 × ' + days + ' 天）');
      }else{
        note = '固定预算';
      }
      note = '已用 ' + Math.round(spent / budget * 100) + '% · ' + note;
      var freqTxt = (budgetModeOf(c) === 'periodic') ? freqStatusText(freqStatus(c, todayStr())) : '';
      if(freqTxt) note += ' · ' + freqTxt;
      note += over
        ? ' · 超支 ' + fmtMoney(spent - budget)
        : ' · ' + (freqTxt ? '本期还剩 ' : '还剩 ') + fmtMoney(budget - spent);
    }
    if(share > 0) note = (note ? note + ' · ' : '') + '占总支出 ' + share + '%';
    var idle = !(budget > 0) && !(spent > 0);
    return '<div class="cat-progress clickable' + (isTop ? ' cat-top' : '') + (idle ? ' compact' : '') +
        '" data-cat="' + escapeHtml(c.id) + '">' +
        '<div class="top">' +
          '<span class="name">' + (c.emoji || '') + ' ' + escapeHtml(c.name) +
            (isTop ? '<span class="cat-chip">最大支出</span>' : '') + '</span>' +
          '<span class="right">' +
            '<span class="nums' + (over ? ' over' : '') + (spent > 0 ? '' : ' zero') + '">' + fmtMoney(spent) +
              (budget > 0 ? ' / ' + fmtMoney(budget) : '') + '</span>' +
            '<span class="qadd">＋</span>' +
          '</span>' +
        '</div>' +
        (budget > 0
          ? '<div class="bar"><div class="bar-fill' + (over ? ' over' : '') + '" style="width:' + pct + '%"></div></div>'
          : '') +
        (note ? '<div class="text-muted" style="font-size:12px;margin-top:6px">' + note + '</div>' : '') +
      '</div>';
  }).join('');

  if(unknownSum > 0){
    html += '<div class="cat-progress">' +
        '<div class="top"><span class="name">❓ 未分类</span>' +
          '<span class="nums">' + fmtMoney(unknownSum) + '</span></div>' +
        '<div class="text-muted" style="font-size:12px;margin-top:6px">原分类已删除 · 不占预算</div>' +
      '</div>';
  }
  wrap.innerHTML = html;
}

/* =========================================================
 *  日历汇总（年 → 月 → 日，可上钻下钻；记账周期 / 自然月两种口径）
 * ========================================================= */
var CAL_KEY = 'personal_ledger_cal_view_v1';
var SUMMARY_MODE_KEY = 'personal_ledger_summary_mode_v1';

function calPad2(n){ return (n < 10 ? '0' : '') + n; }
function calYmd(d){ var a = String(d || '').split('-'); return { y:Number(a[0]) || 0, m:Number(a[1]) || 0, d:Number(a[2]) || 0 }; }
function calLastDay(y, m){ return new Date(y, m, 0).getDate(); }
function calDowMon(dateStr){ var d = new Date(dateStr + 'T00:00:00'); return isNaN(d.getTime()) ? 0 : ((d.getDay() + 6) % 7); }
function calWeekStartOf(dateStr){ return plusDays(dateStr, -calDowMon(dateStr)); }
function calWeekEndOf(dateStr){ return plusDays(calWeekStartOf(dateStr), 6); }

function loadCalView(){
  var def = { mode:'period', level:'month', year:0, month:0, periodKey:null, weekStart:null, date:null };
  try{
    var raw = localStorage.getItem(CAL_KEY);
    if(raw){
      var v = JSON.parse(raw);
      if(v && typeof v === 'object'){
        return {
          mode: v.mode === 'month' ? 'month' : 'period',
          level: (v.level === 'year' || v.level === 'day' || v.level === 'week') ? v.level : 'month',
          year: Number(v.year) || 0,
          month: Number(v.month) || 0,
          periodKey: v.periodKey || null,
          weekStart: /^\d{4}-\d{2}-\d{2}$/.test(String(v.weekStart || '')) ? v.weekStart : null,
          date: v.date || null
        };
      }
    }
  }catch(e){}
  return def;
}
function saveCalView(){
  try{ localStorage.setItem(CAL_KEY, JSON.stringify(calView)); }catch(e){}
}
/* 切换账簿后：日历和汇总跟着回到这本账簿，明细也回到「本账期」 */
function calFocusActive(){
  if(!calView) calView = loadCalView();
  var p = getActivePeriod();
  if(!p) return;
  var y = Number(String(p.startDate || '').slice(0, 4)) || calView.year;
  var m = Number(String(p.startDate || '').slice(5, 7)) || 1;
  calView.year = y;
  calView.month = m;
  calView.periodKey = (calView.mode === 'month') ? ('m' + m) : p.id;
  calView.level = 'month';
  calView.date = null;
  calView.weekStart = calWeekStartOf(p.startDate || todayStr());
  saveCalView();
  recScope = 'period';
  var scopeEl = document.getElementById('recordScope');
  if(scopeEl) scopeEl.value = 'period';
}
function loadSummaryMode(){
  try{ return localStorage.getItem(SUMMARY_MODE_KEY) === 'calendar' ? 'calendar' : 'category'; }catch(e){ return 'category'; }
}
function saveSummaryMode(){

}

/* 日历/汇总只看当前账簿：跨账簿只在「明细 · 全部账期」里看 */
function calScopePeriods(){
  var ap = getActivePeriod();
  return ap ? [ap] : state.periods;
}

/* 有数据的年份（账期起止年份 + 今天所在年） */
function calYears(){
  var set = {};
  calScopePeriods().forEach(function(p){
    var sp = calYmd(p.startDate), ep = calYmd(p.endDate);
    if(sp.y) set[sp.y] = true;
    if(ep.y) set[ep.y] = true;
  });
  if(!Object.keys(set).length) set[calYmd(todayStr()).y] = true;
  return Object.keys(set).map(Number).sort(function(a, b){ return a - b; });
}

/* 12 个月支出（迷你柱用，纯按记录日期，和口径无关） */
function calMonthlyExpense(year){
  var arr = [];
  for(var i = 0; i < 12; i++) arr.push(0);
  calScopePeriods().forEach(function(p){
    (p.records || []).forEach(function(r){
      if(r.type === 'income') return;
      var d = calYmd(r.date);
      if(d.y !== year) return;
      arr[Math.min(11, Math.max(0, d.m - 1))] = round2(arr[Math.min(11, Math.max(0, d.m - 1))] + Number(r.amount || 0));
    });
  });
  return arr;
}

function makeBucket(key, label, start, end, records, monthIndex){
  var exp = 0, inc = 0;
  records.forEach(function(r){
    if(r.type === 'income') inc += Number(r.amount || 0);
    else exp += Number(r.amount || 0);
  });
  return {
    key:key, label:label, start:start, end:end, records:records,
    month:monthIndex || 0, expense:round2(exp), income:round2(inc), count:records.length
  };
}

/* 一个「月」= 一个账期，或一个自然月 */
function calBuckets(year){
  var out = [];
  if(calView.mode === 'period'){
    calScopePeriods().forEach(function(p){
      var sp = calYmd(p.startDate), ep = calYmd(p.endDate);
      if(sp.y !== year && ep.y !== year) return;
      out.push(makeBucket(p.id, p.name || '账期', p.startDate, p.endDate, (p.records || []).slice(), sp.m));
    });
    out.sort(function(a, b){ return String(a.start).localeCompare(String(b.start)); });
  }else{
    var byM = {};
    calScopePeriods().forEach(function(p){
      (p.records || []).forEach(function(r){
        var d = calYmd(r.date);
        if(d.y !== year) return;
        (byM[d.m] = byM[d.m] || []).push(r);
      });
    });
    for(var m = 1; m <= 12; m++){
      var st = year + '-' + calPad2(m) + '-01';
      var en = year + '-' + calPad2(m) + '-' + calPad2(calLastDay(year, m));
      out.push(makeBucket('m' + m, m + ' 月', st, en, byM[m] || [], m));
    }
  }
  return out;
}

function calRecordsOn(date){
  var out = [];
  calScopePeriods().forEach(function(p){
    (p.records || []).forEach(function(r){
      if(String(r.date) === date) out.push({ rec:r, period:p });
    });
  });
  return out;
}

function calCatLabel(r){
  if(r.type === 'expense'){
    var c = state.categoriesExpense.filter(function(x){ return x.id === r.categoryId; })[0];
    return c ? (escapeHtml(c.emoji || '') + ' ' + escapeHtml(c.name)) : '❓ 未分类';
  }
  var ci = state.categoriesIncome.filter(function(x){ return x.id === r.categoryId; })[0];
  return ci ? escapeHtml(ci.name) : '❓ 未分类';
}
function calAcctName(id){
  var a = acctById(id);
  if(a) return a.name;
  var g = (state.accounts || []).filter(function(x){ return x.id === id; })[0];
  return g ? g.name : '未知账户';
}

function calCurrentBucket(){
  var bs = calBuckets(calView.year);
  return bs.filter(function(b){ return b.key === calView.periodKey; })[0] || null;
}

function calMonthLabel(){
  if(calView.mode === 'month') return calView.month + ' 月';
  var b = calCurrentBucket();
  return b ? (b.label || (calView.month + ' 月')) : (calView.month + ' 月');
}

/* 修正当前视图状态：年份越界、账期被删、日期失效 */
function calEnsure(){
  if(!calView) calView = loadCalView();
  var years = calYears();
  if(years.length && years.indexOf(calView.year) < 0) calView.year = years[years.length - 1];
  if(!calView.year) calView.year = calYmd(todayStr()).y;

  if(calView.level === 'week' && !/^\d{4}-\d{2}-\d{2}$/.test(String(calView.weekStart || ''))){
    calView.weekStart = calWeekStartOf(calView.date || todayStr());
  }

  if(calView.mode === 'month'){
    if(!(calView.month >= 1 && calView.month <= 12)){
      var t = calYmd(todayStr());
      calView.month = (t.y === calView.year) ? t.m : 1;
    }
    calView.periodKey = 'm' + calView.month;
  }else{
    var bs = calBuckets(calView.year);
    var has = bs.filter(function(b){ return b.key === calView.periodKey; })[0];
    if(!has){
      var ap = getActivePeriod();
      has = (ap && bs.filter(function(b){ return b.key === ap.id; })[0]) || bs[bs.length - 1] || null;
      calView.periodKey = has ? has.key : null;
    }
    if(has){
      calView.month = calYmd(has.start).m;
      if(calView.level === 'day' && !/^\d{4}-\d{2}-\d{2}$/.test(String(calView.date || ''))){
        calView.level = 'month';
        calView.date = null;
      }
    }
  }
}

      '</div>' +

}

/* 年视图：12 个月迷你柱 + 每个月的合计，点进去下钻 */
function calYearBodyHtml(){
  var year = calView.year;
  var months = calMonthlyExpense(year);
  var mx = months.reduce(function(a, b){ return Math.max(a, b); }, 0);

  var bars = months.map(function(v, i){
    var h = mx > 0 ? Math.max(2, Math.round(v / mx * 44)) : 2;
    var cls = 'b' + (v > 0 ? '' : ' dim') + (v === mx && v > 0 ? ' max' : '');
    return '<div class="' + cls + '" style="height:' + h + 'px" data-cal-mini="' + (i + 1) + '"></div>';
  }).join('');
  var xl = months.map(function(_, i){ return '<span>' + (i + 1) + '</span>'; }).join('');

  var buckets = calBuckets(year);
  var exp = 0, inc = 0, cnt = 0;
  buckets.forEach(function(b){ exp += b.expense; inc += b.income; cnt += b.count; });
  exp = round2(exp); inc = round2(inc);

  var rows = buckets.map(function(b){
    var sub;
    if(calView.mode === 'period'){
      sub = b.start + ' ~ ' + b.end + ' · ' + b.count + ' 笔';
    }else{
      sub = b.count ? (b.count + ' 笔' + (b.income > 0 ? ' · 收入 ' + fmtMoney(b.income) : '')) : '暂无记录';
    }
    return '<div class="cal-row" data-bucket="' + escapeHtml(b.key) + '">' +
        '<div class="lb"' + (b.count ? '' : ' style="color:#c3ccc9"') + '>' + escapeHtml(b.label) + '</div>' +
        '<div class="sub">' + escapeHtml(sub) + '</div>' +
        '<div class="amt' + (b.expense > 0 ? '' : ' text-muted') + '">' + fmtMoney(b.expense) + '<small>支出</small></div>' +
      '</div>';
  }).join('');

  return '<div class="cal-kpis">' +
      '<div>全年支出<b class="text-danger">' + fmtMoney(exp) + '</b></div>' +
      '<div>全年收入<b>' + fmtMoney(inc) + '</b></div>' +
      '<div>净额<b class="' + (round2(inc - exp) < 0 ? 'text-danger' : '') + '">' + fmtMoney(round2(inc - exp)) + '</b></div>' +
      '<div>笔数<b>' + cnt + '</b></div>' +
    '</div>' +
    '<div class="cal-mini">' + bars + '</div>' +

      (calView.mode === 'period' ? '账期' : '月') + '的日历。</div>';
}

/* 月视图的每日支出柱状图（点柱子进当天） */
function calMonthBarsHtml(b, dm){
  var spans = daysBetween(b.start, b.end);
  if(spans <= 0 || spans > 62) return '';
  var arr = [];
  for(var i = 0; i < spans; i++){
    var ds = plusDays(b.start, i);
    var info = dm[ds];
    arr.push({ d: ds, v: info ? info.expense : 0 });
  }
  var mx = arr.reduce(function(a, x){ return Math.max(a, x.v); }, 0);
  if(mx <= 0) return '';
  var bars = arr.map(function(x){
    var h = x.v > 0 ? Math.max(3, Math.round(x.v / mx * 46)) : 2;
    var cls = 'cb' + (x.v > 0 ? '' : ' zero') + (x.v === mx ? ' max' : '') + (x.d === todayStr() ? ' today' : '');
    var tt = x.d.slice(5) + (x.v > 0 ? ' 支出 ' + fmtMoney(x.v) : ' 没有支出');
    return '<div class="' + cls + '"' + (x.v > 0 ? ' data-cal-bar="' + x.d + '"' : '') + ' title="' + tt + '">' +
        '<div class="cb-fill" style="height:' + h + 'px"></div>' +
      '</div>';
  }).join('');
  var labels = arr.map(function(x){
    var d = Number(x.d.slice(8, 10));
    return '<span>' + ((d === 1 || d % 5 === 0 || x.d === b.end) ? d : '') + '</span>';
  }).join('');
  return '<div class="cal-bars">' +
      '<div class="cal-bars-hd"><span>每天支出</span><span>最高 ' + fmtMoney(mx) + ' · 点柱子看当天</span></div>' +
      '<div class="cal-bars-row">' + bars + '</div>' +
      '<div class="cal-bars-x">' + labels + '</div>' +
    '</div>';
}

/* 月视图：日历格子，格子里是当天支出 */
function calMonthBodyHtml(){
  var b = calCurrentBucket();
  if(!b) return '<div class="cal-empty">这个' + (calView.mode === 'period' ? '年还没有账期' : '月还没有记录') + '</div>';

  var dm = {};
  b.records.forEach(function(r){
    var k = String(r.date || '');
    if(!dm[k]) dm[k] = { expense:0, income:0, count:0 };
    dm[k].count++;
    if(r.type === 'income') dm[k].income = round2(dm[k].income + Number(r.amount || 0));
    else dm[k].expense = round2(dm[k].expense + Number(r.amount || 0));
  });
  var maxDay = 0;
  Object.keys(dm).forEach(function(k){ maxDay = Math.max(maxDay, dm[k].expense); });

  /* 本月花得最多的 3 天（有支出的日子不足 3 天就不标） */
  var dayRanks = {};
  (function(){
    var ds = Object.keys(dm).filter(function(k){ return dm[k].expense > 0; })
      .sort(function(a, b){ return dm[b].expense - dm[a].expense; });
    if(ds.length >= 3) ds.slice(0, 3).forEach(function(k, i){ dayRanks[k] = i + 1; });
  })();

  var spans = daysBetween(b.start, b.end);
  var daily = spans > 0 ? round2(b.expense / spans) : 0;

  var sp = calYmd(b.start), ep = calYmd(b.end);
  var blocks = [];
  var yy = sp.y, mm = sp.m, guard = 0;
  while((yy < ep.y || (yy === ep.y && mm <= ep.m)) && guard < 4){
    blocks.push({ y:yy, m:mm });
    mm++; if(mm > 12){ mm = 1; yy++; }
    guard++;
  }

  var grid = blocks.map(function(blk){
    var last = calLastDay(blk.y, blk.m);
    var firstDow = (new Date(blk.y, blk.m - 1, 1).getDay() + 6) % 7;
    var cells = '';
    for(var i = 0; i < firstDow; i++) cells += '<div class="cal-cell out"></div>';
    for(var d = 1; d <= last; d++){
      var ds = blk.y + '-' + calPad2(blk.m) + '-' + calPad2(d);
      var inRange = ds >= b.start && ds <= b.end;
      var info = dm[ds];
      var cls = 'cal-cell';
      var extra = '', amt = '';
      if(!inRange){
        cls += ' out';
      }else if(info){
        var hv = (maxDay > 0 && info.expense > 0) ? (info.expense / maxDay) : 0;
        var lv = hv > 0.75 ? 4 : (hv > 0.5 ? 3 : (hv > 0.25 ? 2 : (hv > 0 ? 1 : 0)));
        cls += ' h' + lv + ' clickable';
        if(dayRanks[ds]) cls += ' rank' + dayRanks[ds];
        if(info.expense > 0) amt = '<div class="amt">' + Math.round(info.expense) + '</div>';
        if(info.income > 0) extra = '<span class="dot"></span>';
      }else{
        cls += ' empty';
      }
      if(ds === todayStr()) cls += ' today';
      cells += '<div class="' + cls + '"' + ((inRange && info) ? ' data-cal-date="' + ds + '"' : '') + '>' +
          extra + '<div class="d">' + (blocks.length > 1 ? blk.m + '/' + d : d) + '</div>' + amt +
        '</div>';
    }
    return '<div class="cal-mon-title">' + blk.y + ' 年 ' + blk.m + ' 月</div>' +
      '<div class="cal-grid">' +
        '<div class="cal-dow">一</div><div class="cal-dow">二</div><div class="cal-dow">三</div>' +
        '<div class="cal-dow">四</div><div class="cal-dow">五</div><div class="cal-dow">六</div><div class="cal-dow">日</div>' +
        cells +
      '</div>';
  }).join('');

  return '<div class="cal-kpis">' +
      '<div>支出<b class="text-danger">' + fmtMoney(b.expense) + '</b></div>' +
      '<div>收入<b>' + fmtMoney(b.income) + '</b></div>' +
      '<div>日均<b>' + fmtMoney(daily) + '</b></div>' +
      '<div>笔数<b>' + b.count + '</b></div>' +
    '</div>' + calMonthBarsHtml(b, dm) + grid +
    '<div class="text-muted mt-8" style="font-size:12px">格子里的数字是当天支出（只显示整数，颜色越深花得越多）。红 / 橙 / 黄三种底色是本月花得最多的 3 天。点有记录的那天看明细，点上方年份回全年。</div>';
}

/* 周视图：一周 7 天，按日期算（跨账期也照算） */
function calWeekBodyHtml(){
  var ws = calWeekStartOf(calView.weekStart || calView.date || todayStr());
  var we = plusDays(ws, 6);
  var dowNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  var days = [];
  for(var i = 0; i < 7; i++){
    var d = plusDays(ws, i);
    var recs = calRecordsOn(d);
    var e = 0, n = 0;
    recs.forEach(function(x){
      if(x.rec.type === 'income') n = round2(n + Number(x.rec.amount || 0));
      else e = round2(e + Number(x.rec.amount || 0));
    });
    days.push({ date:d, dow:dowNames[i], exp:e, inc:n, count:recs.length });
  }

  var exp = 0, inc = 0, cnt = 0;
  days.forEach(function(x){ exp = round2(exp + x.exp); inc = round2(inc + x.inc); cnt += x.count; });

  /* 本周花得最多的 3 天（有支出的日子不足 3 天就不标） */
  var ranks = {};
  (function(){
    var ds = days.filter(function(x){ return x.exp > 0; }).slice()
      .sort(function(a, b){ return b.exp - a.exp; });
    if(ds.length >= 3) ds.slice(0, 3).forEach(function(x, i){ ranks[x.date] = i + 1; });
  })();

  var mx = days.reduce(function(a, b){ return Math.max(a, b.exp); }, 0);
  var bars = days.map(function(x){
    var h = mx > 0 ? Math.max(2, Math.round(x.exp / mx * 42)) : 2;
    return '<div class="b' + (x.exp > 0 ? '' : ' dim') + (x.exp === mx && x.exp > 0 ? ' max' : '') +
      '" style="height:' + h + 'px"' + (x.count ? ' data-cal-date="' + x.date + '"' : '') + '></div>';
  }).join('');

  var rows = days.map(function(x){
    var rank = ranks[x.date];
    var cls = 'cal-wrow' + (rank ? ' rank' + rank : '') + (x.count ? ' clickable' : ' zero') +
      (x.date === todayStr() ? ' is-today' : '');
    return '<div class="' + cls + '"' + (x.count ? ' data-cal-date="' + x.date + '"' : '') + '>' +
        '<div class="wd">' + x.dow + '<small>' + x.date.slice(5) + '</small></div>' +
        '<div class="cnt">' + (x.count
          ? (x.count + ' 笔' + (x.inc > 0 ? ' · 收入 ' + fmtMoney(x.inc) : ''))
          : '没有记录') + '</div>' +
        '<div class="amt">' + fmtMoney(x.exp) + '</div>' +
      '</div>';
  }).join('');

  return '<div class="cal-kpis">' +
      '<div>本周支出<b class="text-danger">' + fmtMoney(exp) + '</b></div>' +
      '<div>本周收入<b>' + fmtMoney(inc) + '</b></div>' +
      '<div>日均<b>' + fmtMoney(round2(exp / 7)) + '</b></div>' +
      '<div>笔数<b>' + cnt + '</b></div>' +
    '</div>' +
    '<div class="row" style="justify-content:space-between;align-items:center;margin:8px 0 2px;flex-wrap:wrap;gap:6px">' +
      '<span class="text-muted" style="font-size:12px">' + ws + ' ~ ' + we + '</span>' +
      '<div class="row" style="gap:4px">' +
        '<button type="button" class="btn-ghost btn-tiny" data-week-delta="-1">‹ 上一周</button>' +
        '<button type="button" class="btn-ghost btn-tiny" data-week-delta="1">下一周 ›</button>' +
      '</div>' +
    '</div>' +
    '<div class="cal-mini">' + bars + '</div>' +
    '<div class="cal-mini-x"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>' +
    rows +
    '<div class="text-muted mt-8" style="font-size:12px">这个是按日期算的一周，跨账期也照算。点某一天看当天明细；红 / 橙 / 黄是本周花得最多的 3 天。</div>';
}

/* 跳回今天所在的月（今天那格本来就有绿框高亮） */
function calGotoToday(){
  var t = todayStr();
  var td = calYmd(t);
  calView.year = td.y;
  calView.date = null;
  calView.level = 'month';

  if(calView.mode === 'month'){
    calView.month = td.m;
    calView.periodKey = 'm' + td.m;
  }else{
    var bs = calBuckets(td.y);
    var hit = bs.filter(function(b){ return b.start <= t && b.end >= t; })[0];
    if(!hit){
      var before = bs.filter(function(b){ return b.start <= t; });
      hit = before[before.length - 1] || bs[0] || null;
    }
    calView.periodKey = hit ? hit.key : null;
    if(hit) calView.month = calYmd(hit.start).m;
  }

  if(!calView.periodKey && calView.mode === 'period'){
    calView.level = 'year';
  }
  calEnsure();
  saveCalView();
  renderSummary();
}

function calGotoMonth(m){
  if(!(m >= 1 && m <= 12)) return;
  calView.level = 'month';
  calView.date = null;
  if(calView.mode === 'month'){
    calView.month = m;
    calView.periodKey = 'm' + m;
  }else{
    var first = calView.year + '-' + calPad2(m) + '-01';
    var last = calView.year + '-' + calPad2(m) + '-' + calPad2(calLastDay(calView.year, m));
    var found = calBuckets(calView.year).filter(function(b){ return b.start <= last && b.end >= first; })[0];
    if(found){ calView.periodKey = found.key; calView.month = m; }
  }
  saveCalView();
  renderSummary();
}

/* =========================================================
 *  账户管理
 * ========================================================= */
function showAccountEditor(){
  var p0 = getActivePeriod();
  var rows = visibleAccounts(p0).map(function(a){ return { id:a.id, name:a.name }; });
  var ui = openWizard({
    center: true,
    title: '账户管理',
    buttons: [
      { label:'取消', cls:'btn btn-outline', onClick: function(){ closeWizard(); } },
      { label:'保存', cls:'btn btn-primary', onClick: saveAccounts }
    ]
  });
  renderList();

  function renderList(){
    ui.body.innerHTML =
      '<div class="step-hint">管理账户（改名、新增、删除）。期初余额在新建账期时填写。删账户只影响当前账期，不会动到别的账簿。</div>' +
      '<div id="aeRows"></div>' +
      '<button type="button" class="btn btn-outline btn-block btn-sm mt-8" id="aeAdd">+ 新增账户</button>';
    var wrap = ui.body.querySelector('#aeRows');

    rows.forEach(function(r, idx){
      var row = document.createElement('div');
      row.className = 'setup-acct';

      var nameI = document.createElement('input');
      nameI.className = 'form-input name';
      nameI.value = r.name || '';
      nameI.addEventListener('input', function(){ rows[idx].name = nameI.value; });

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn-ghost btn-tiny text-danger';
      delBtn.textContent = '删';
      delBtn.addEventListener('click', function(){
        if(rows.length <= 1){ toast('至少保留一个账户'); return; }
        rows.splice(idx, 1);
        renderList();
      });

      row.appendChild(nameI);
      row.appendChild(delBtn);
      wrap.appendChild(row);
    });

    ui.body.querySelector('#aeAdd').addEventListener('click', function(){
      rows.push({ id: uid('a'), name:'新账户' });
      renderList();
    });
  }

  function saveAccounts(){
    var p = getActivePeriod();
    if(!p){ toast('请先创建账期'); return; }
    var oldIds = accountsOf(p).map(function(a){ return a.id; });
    var newIds = rows.map(function(r){ return r.id; });
    var gone = oldIds.filter(function(id){ return newIds.indexOf(id) < 0; });

    if(gone.length){
      var names = gone.map(function(id){ return acctNameById(id, p); });
      var hasRec = (p.records || []).some(function(r){ return gone.indexOf(r.accountId) >= 0; });
      if(hasRec && !confirm('本账簿里「' + names.join('、') + '」名下已有记录，删除后这些记录也会一起删掉（其他账簿不受影响），确定继续吗？')) return;
    }

    /* 改名：只改本账簿 */
    var list = accountsOf(p);
    rows.forEach(function(r){
      var a = list.filter(function(x){ return x.id === r.id; })[0];
      if(a) a.name = String(r.name || '').trim() || '未命名账户';
    });
    /* 新增：只加进本账簿 */
    p.openingBalances = p.openingBalances || {};
    rows.forEach(function(r){
      if(list.some(function(x){ return x.id === r.id; })) return;
      list.push({ id: r.id, name: String(r.name || '').trim() || '未命名账户' });
      p.openingBalances[r.id] = 0;
    });
    /* 删除：只从本账簿移除 */
    gone.forEach(function(g){ removeAcctFromPeriod(p, g); });

    saveAll();
    closeWizard(true);
    toast('已更新');
    render();
  }
}

 *  预算设置
