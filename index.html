<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>个人记账</title>
<style>
/* ========== 全局样式 · 薄荷绿+白底 ========== */
:root{
  --mint-50:#f0fbf6;
  --mint-100:#d6f5e3;
  --mint-200:#aee9cc;
  --mint-300:#7ed9ae;
  --mint-400:#4cc58d;
  --mint-500:#2db372;
  --mint-600:#219960;
  --mint-700:#1a7a4d;
  --mint-800:#155d3c;
  --text-1:#1f2937;
  --text-2:#4b5563;
  --text-3:#9ca3af;
  --border:#e5e7eb;
  --bg:#ffffff;
  --bg-soft:#f9fafb;
  --danger:#ef4444;
  --danger-bg:#fef2f2;
  --warn:#f59e0b;
  --warn-bg:#fffbeb;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text-1);
  background:var(--mint-50);
  font-size:15px;
  line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--mint-600);text-decoration:none}

/* ========== 布局 ========== */
.app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 24px rgba(0,0,0,.04);padding-bottom:80px}
.header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(135deg,var(--mint-400),var(--mint-500));
  color:#fff;padding:16px 20px;
  box-shadow:0 2px 12px rgba(45,179,114,.25);
}
.header h1{font-size:18px;font-weight:600}
.header .sub{font-size:12px;opacity:.9;margin-top:2px}
.header .row{display:flex;justify-content:space-between;align-items:center}
.header .btn-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.2)}
.header .btn-icon:active{background:rgba(255,255,255,.35)}

.content{padding:16px 20px}

/* ========== 概览卡片 ========== */
.overview{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;
}
.card{
  background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;
}
.card .label{font-size:12px;color:var(--text-3)}
.card .value{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.card.primary .value{color:var(--mint-600)}
.card.income .value{color:var(--mint-600)}
.card.expense .value{color:var(--danger)}
.card.balance .value{color:var(--mint-700)}
.card.balance.negative .value{color:var(--danger)}
.card.wide{grid-column:1 / -1}
.card.free .value{color:var(--mint-700)}
.card.free.negative .value{color:var(--danger)}
.card .meta{font-size:12px;color:var(--text-3);margin-top:3px}

/* ========== 按钮 ========== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 18px;border-radius:10px;font-weight:500;transition:all .15s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--mint-500);color:#fff}
.btn-primary:hover{background:var(--mint-600)}
.btn-outline{background:#fff;color:var(--mint-600);border:1px solid var(--mint-300)}
.btn-outline:hover{background:var(--mint-50)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{background:var(--bg-soft)}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #fecaca}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn-tiny{padding:4px 8px;font-size:12px;border-radius:6px}

/* ========== FAB 悬浮按钮 ========== */
.fab-bar{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  display:flex;gap:12px;z-index:50;
}
.fab{
  display:flex;align-items:center;gap:6px;
  padding:12px 20px;border-radius:999px;
  background:var(--mint-500);color:#fff;font-weight:500;
  box-shadow:0 4px 16px rgba(45,179,114,.4);
}
.fab.expense{background:var(--danger);box-shadow:0 4px 16px rgba(239,68,68,.35)}
.fab.income{background:var(--mint-500)}

/* ========== 通用组件 ========== */
.section-title{
  font-size:14px;font-weight:600;color:var(--text-2);margin:20px 0 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.empty{
  text-align:center;padding:40px 20px;color:var(--text-3);font-size:14px;
}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;background:var(--mint-100);color:var(--mint-700)}

/* ========== 引导流程 Wizard ========== */
.wizard-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
.wizard-mask.center{align-items:center}
.wizard{
  background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;
  max-height:92vh;
  display:flex;flex-direction:column;
  animation:slideUp .25s ease;
}
.wizard-mask.center .wizard{border-radius:20px;max-height:90vh}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
.wizard-header{
  padding:18px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.wizard-title{font-size:16px;font-weight:600}
.wizard-step{font-size:12px;color:var(--text-3)}
.wizard-body{padding:20px;overflow-y:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch}
.wizard-footer{
  padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);
  display:flex;gap:10px;flex-shrink:0;background:#fff;
}
.wizard-footer .btn{flex:1}

.step-hint{
  font-size:13px;color:var(--text-2);margin-bottom:14px;line-height:1.6;
}
.step-hint b{color:var(--mint-700)}

/* ========== 表单 ========== */
.form-group{margin-bottom:16px}
.form-label{
  display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;
}
.form-input,.form-select{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;
  background:var(--bg-soft);font-size:15px;transition:border-color .15s;
}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--mint-400);background:#fff}
.form-input.amount{font-size:20px;font-weight:600;color:var(--text-1);text-align:right;letter-spacing:.5px}
.form-input.hint{font-size:14px;color:var(--text-3)}
.form-row{display:flex;gap:10px}
.form-row>.form-group{flex:1;margin-bottom:0}

/* ========== 分类选择 ========== */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(min-width:480px){.cat-grid{grid-template-columns:repeat(5,1fr)}}
.cat-item{
  padding:12px 6px;border-radius:10px;text-align:center;
  border:1px solid var(--border);background:#fff;transition:all .15s;
  font-size:14px;cursor:pointer;
}
.cat-item:active{transform:scale(.95)}
.cat-item.selected{
  background:var(--mint-100);border-color:var(--mint-400);color:var(--mint-700);
}
.cat-item .emoji{font-size:22px;display:block;margin-bottom:4px}
.cat-add{
  padding:12px 6px;border-radius:10px;text-align:center;
  border:1px dashed var(--mint-300);color:var(--mint-600);font-size:13px;
  background:var(--mint-50);cursor:pointer;
}

/* ========== 账户选择 ========== */
.acct-chips{display:flex;flex-wrap:wrap;gap:8px}
.acct-chip{
  padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;
  font-size:14px;transition:all .15s;cursor:pointer;
}
.acct-chip.selected{background:var(--mint-100);border-color:var(--mint-400);color:var(--mint-700)}

/* ========== 列表 ========== */
.list-item{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
.list-item:last-child{border-bottom:none}
.list-item .icon{
  width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--mint-50);font-size:20px;flex-shrink:0;
}
.list-item .main{flex:1;min-width:0}
.list-item .title{font-weight:500;font-size:15px}
.list-item .meta{font-size:12px;color:var(--text-3);margin-top:2px}
.list-item .amount{font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.list-item .amount.expense{color:var(--danger)}
.list-item .amount.income{color:var(--mint-600)}
.list-item .actions{display:flex;gap:4px;margin-left:8px}

/* ========== 账户余额 ========== */
.acct-card{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;
  background:#fff;
}
.acct-card .name{font-weight:500}
.acct-card .bal{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.acct-card .meta{font-size:12px;color:var(--text-3)}

/* ========== 分类进度条 ========== */
.cat-progress{
  margin-bottom:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:#fff;
}
.cat-progress .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.cat-progress .name{font-weight:500}
.cat-progress .nums{font-variant-numeric:tabular-nums;color:var(--text-2)}
.cat-progress .nums.over{color:var(--danger)}
.cat-progress .nums.zero{color:#c3ccc9}
.cat-progress .top .right{display:flex;align-items:center;gap:8px}
.cat-progress .qadd{width:22px;height:22px;border-radius:50%;background:#f0fdf9;color:var(--mint-600);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 auto}
.cat-progress.compact{padding:9px 14px;margin-bottom:8px}
.cat-progress.compact .top{margin-bottom:0}
.bar{height:6px;background:var(--bg-soft);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--mint-400);transition:width .3s}
.bar-fill.over{background:var(--danger)}

/* ========== 汇总表 ========== */
.summary-table{
  width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;
}
.summary-table th,.summary-table td{
  padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);
}
.summary-table th{font-size:12px;color:var(--text-3);font-weight:500}
.summary-table td.num,.summary-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.summary-table tr.total td{font-weight:600;background:var(--mint-50)}
.summary-table tr.expense-total td{font-weight:600;background:#fef2f2}

/* ========== 工具 ========== */
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.text-center{text-align:center}
.text-muted{color:var(--text-3)}
.text-danger{color:var(--danger)}
.fw-600{font-weight:600}
.tabular{font-variant-numeric:tabular-nums}
.flex-1{flex:1}
.hide{display:none !important}

/* Tab 切换 */
.tabs{
  display:flex;gap:4px;background:var(--bg-soft);padding:4px;border-radius:10px;margin-bottom:16px;
}
.tab{
  flex:1;padding:8px;border-radius:8px;text-align:center;font-size:14px;color:var(--text-2);cursor:pointer;
}
.tab.active{background:#fff;color:var(--mint-600);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn-ghost.on{color:var(--mint-700);font-weight:600;background:var(--mint-100)}

/* ---------- 日历汇总 ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.cal-crumb{font-size:14px;font-weight:600;color:#111827;font-variant-numeric:tabular-nums}
.cal-crumb .seg{cursor:pointer;color:var(--mint-600);text-decoration:underline;text-underline-offset:3px}
.cal-crumb .sep{color:#d8e2de;padding:0 5px}
.cal-scope{display:inline-flex;background:var(--mint-50);border-radius:8px;padding:3px;gap:2px}
.cal-scope .s{padding:4px 10px;border-radius:6px;font-size:12px;color:#7b8a85;cursor:pointer;white-space:nowrap}
.cal-scope .s.on{background:#fff;color:var(--mint-700);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.cal-kpis{display:flex;gap:14px;flex-wrap:wrap;padding:8px 0 2px}
.cal-kpis>div{font-size:11px;color:#8b9a95;min-width:62px}
.cal-kpis b{display:block;font-size:16px;font-weight:600;color:#111827;margin-top:2px;font-variant-numeric:tabular-nums}
.cal-mini{display:flex;align-items:flex-end;gap:3px;height:48px;padding:0 2px;margin:10px 0 3px}
.cal-mini .b{flex:1;background:var(--mint-200);border-radius:3px 3px 0 0;min-height:2px;cursor:pointer}
.cal-mini .b.max{background:var(--mint-500)}
.cal-mini .b.dim{background:#eff4f2;cursor:pointer}
.cal-mini-x{display:flex;gap:3px;padding:0 2px;font-size:10px;color:#a7b4af}
.cal-mini-x span{flex:1;text-align:center}
.cal-mon-title{font-size:11px;color:#8b9a95;margin:14px 0 5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:11px;color:#a7b4af;padding:2px 0}
.cal-cell{position:relative;border-radius:8px;min-height:46px;padding:3px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1px solid #f2f7f5;overflow:hidden}
.cal-cell .d{font-size:11px;color:#4b5b56;line-height:1.1}
.cal-cell .amt{font-size:11px;font-weight:600;color:var(--mint-800);margin-top:1px;line-height:1.1}
.cal-cell.h1{background:var(--mint-50);border-color:var(--mint-100)}
.cal-cell.h2{background:var(--mint-100);border-color:var(--mint-200)}
.cal-cell.h3{background:var(--mint-200);border-color:var(--mint-300)}
.cal-cell.h4{background:var(--mint-300);border-color:var(--mint-400)}
.cal-cell.h4 .d{color:#0f3d28}
.cal-cell.empty{background:#fbfdfc}
.cal-cell.empty .d{color:#bccac5}
.cal-cell.out{background:transparent;border-color:transparent}
.cal-cell.out .d{color:transparent}
.cal-cell.clickable{cursor:pointer}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--mint-500)}
.cal-cell .dot{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--mint-600)}
.cal-row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #f2f7f5;cursor:pointer}
.cal-row .lb{flex:0 0 76px;font-size:14px;font-weight:600;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-row .sub{flex:1;font-size:11px;color:#a7b4af;line-height:1.4;min-width:0}
.cal-row .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;color:var(--mint-800)}
.cal-row .amt small{display:block;font-size:10px;font-weight:400;color:#a7b4af;margin-top:1px}
.cal-empty{color:#a7b4af;font-size:13px;padding:26px 0;text-align:center}

/* ---------- 一句话记账 ---------- */
.quick-line{background:#fff;border-radius:14px;padding:11px 12px 9px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.quick-line .form-input{font-size:15px}
.quick-note{font-size:11px;color:#a7b4af;margin-top:7px;line-height:1.5}
.cat-tip{font-size:11px;color:#a7b4af;margin:-6px 0 8px}
.cat-progress.clickable{cursor:pointer}
.cat-progress.clickable:active{background:var(--mint-50)}
.q-input{width:100%;box-sizing:border-box;border:1px solid #eef2f0;border-radius:10px;padding:13px 14px;font-size:19px;font-weight:600;color:#111827;background:#fff;font-variant-numeric:tabular-nums}
.q-input:focus{outline:none;border-color:#5eead4;box-shadow:0 0 0 3px rgba(16,185,129,.1)}
.q-input::placeholder{font-size:15px;font-weight:400;color:#c3ccc9}
.q-hint{font-size:11px;color:#a7b4af;margin-top:7px;line-height:1.5}
.q-freq{font-size:12px;color:#7a8a80;margin-top:6px;line-height:1.5;word-break:break-all}
.q-freq.over{color:#c0392b}
.q-preview{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 2px;min-height:22px}
.q-chip{display:inline-flex;align-items:center;gap:5px;background:#f0fdf9;border:1px solid #d7f0e7;border-radius:8px;padding:4px 9px;font-size:12px;color:#0f766e}
.q-chip b{font-variant-numeric:tabular-nums}
.q-chip.new{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.q-total{font-size:11px;color:#4b5b56;margin-left:2px}
.q-date-row{display:flex;align-items:center;gap:8px}
.q-date-row .form-input{flex:1}
.cal-wrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #f2f7f5}
.cal-wrow.clickable{cursor:pointer}
.cal-wrow .wd{flex:0 0 62px;font-size:13px;font-weight:600;color:#4b5b56}
.cal-wrow .wd small{display:block;font-size:10px;font-weight:400;color:#a7b4af;margin-top:1px}
.cal-wrow .cnt{flex:1;font-size:11px;color:#a7b4af;min-width:0}
.cal-wrow .amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mint-800);text-align:right}
.cal-wrow.zero .amt{color:#c3ccc9;font-weight:400}
.cal-wrow.rank1 .amt{color:#b91c1c;font-weight:700;font-size:17px}
.cal-wrow.rank2 .amt{color:#c2410c}
.cal-wrow.rank3 .amt{color:#b45309}
.cal-wrow.is-today{background:var(--mint-50)}

/* ---------- 金额突出：当期最大的 3 笔 / 3 天 ---------- */
.rank-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:1px}
.rank-tag.r1{background:#fee2e2;color:#b91c1c}
.rank-tag.r2{background:#ffedd5;color:#c2410c}
.rank-tag.r3{background:#fef3c7;color:#b45309}
.list-item.big-1{border-left:3px solid #dc2626}
.list-item.big-2{border-left:3px solid #ea580c}
.list-item.big-3{border-left:3px solid #d97706}
.list-item.big-1 .amount.expense{color:#b91c1c;font-weight:700;font-size:16px}
.list-item.big-2 .amount.expense{color:#c2410c;font-weight:700;font-size:15px}
.list-item.big-3 .amount.expense{color:#b45309;font-weight:700;font-size:15px}
.cal-cell.rank1{background:#fecaca;border-color:#fca5a5}
.cal-cell.rank1 .d{color:#7f1d1d}
.cal-cell.rank1 .amt{color:#991b1b;font-weight:700;font-size:12px}
.cal-cell.rank2{background:#fed7aa;border-color:#fdba74}
.cal-cell.rank2 .d{color:#7c2d12}
.cal-cell.rank2 .amt{color:#9a3412;font-weight:700;font-size:12px}
.cal-cell.rank3{background:#fde68a;border-color:#fcd34d}
.cal-cell.rank3 .d{color:#713f12}
.cal-cell.rank3 .amt{color:#92400e;font-weight:700;font-size:12px}
.cat-progress.cat-top .name{font-weight:700}
.cat-chip{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;background:#fee2e2;color:#b91c1c}

/* 初始设置特殊样式 */
.setup-acct{
  display:flex;gap:8px;align-items:center;margin-bottom:8px;
}
.setup-acct .form-input{flex:1}
.setup-acct .form-input.name{flex:0 0 110px}

/* ========== 预算逐行填写 ========== */
.budget-row{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.budget-row .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:500}
.budget-row .row-calc{font-size:13px;color:var(--mint-700);font-variant-numeric:tabular-nums;font-weight:600}
.budget-row .row-calc.muted{color:var(--text-3);font-weight:400}
.budget-row .row-inputs{display:flex;gap:8px;margin-top:8px;align-items:center}

<script>
(function(){
'use strict';

/* =========================================================
 *  个人记账 —— 单文件，数据存 localStorage，按账期隔离
 *  结构：state = { periods, activePeriodId, accounts,
 *                  categoriesExpense, categoriesIncome }
 *  period = { id,name,startDate,endDate,openingBalances,records }
 *  record = { id,type,categoryId,amount,accountId,date,note,
 *             price,qty,createdAt }
 * ========================================================= */

var STORAGE_KEY = 'personal_ledger_v1';

var DEFAULT_ACCOUNTS = [
  { id:'a_wechat', name:'微信' },
  { id:'a_alipay', name:'支付宝' },
  { id:'a_cmb',    name:'招商银行' },
  { id:'a_ccb',    name:'建设银行' },
  { id:'a_card',   name:'校园卡' },
  { id:'a_cash',   name:'现金' }
];

var DEFAULT_EXPENSE_CATS = [
  { id:'c_food',     emoji:'🍜', name:'饮食',     budget:0 },
  { id:'c_bath',     emoji:'🚿', name:'洗澡',     budget:0 },
  { id:'c_trans',    emoji:'🚌', name:'交通',     budget:0 },
  { id:'c_commute',  emoji:'🚶', name:'通勤',     budget:0 },
  { id:'c_daily',    emoji:'🧻', name:'日用',     budget:0 },
  { id:'c_shop',     emoji:'🛍️', name:'购物',     budget:0 },
  { id:'c_skincare', emoji:'💄', name:'护肤品',   budget:0 },
  { id:'c_edu',      emoji:'📚', name:'教育培训', budget:0 },
  { id:'c_med',      emoji:'💊', name:'药物',     budget:0 },
  { id:'c_hospital', emoji:'🏥', name:'医疗',     budget:0 },
  { id:'c_netease',  emoji:'🎵', name:'网易云',   budget:0 },
  { id:'c_power',    emoji:'💡', name:'电费',     budget:0 },
  { id:'c_laundry',  emoji:'🧺', name:'洗衣',     budget:0 },
  { id:'c_repay',    emoji:'💳', name:'还款',     budget:0 },
  { id:'c_social',   emoji:'🎁', name:'人际交往', budget:0 },
  { id:'c_invest',   emoji:'📈', name:'投资',     budget:0 },
  { id:'c_fund',     emoji:'💰', name:'基金',     budget:0 },
  { id:'c_baitiao',  emoji:'📋', name:'白条',     budget:0 },
  { id:'c_pocket',   emoji:'💵', name:'零花钱',   budget:0 },
  { id:'c_brother',  emoji:'👦', name:'弟弟',     budget:0 },
  { id:'c_other',    emoji:'📦', name:'额外支出', budget:0 }
];

var DEFAULT_INCOME_CATS = [
  { id:'i_salary',   name:'工资' },
  { id:'i_redpack',  name:'红包' },
  { id:'i_parttime', name:'兼职' },
  { id:'i_invest',   name:'投资收益' },
  { id:'i_other',    name:'其他收入' }
];

var state = null;
var activePeriodId = null;
var summaryMode = 'category';
var calView = null;

/* ================= 基础工具 ================= */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function round2(n){ n = Number(n); if(!isFinite(n)) n = 0; return Math.round(n*100)/100; }
function fmtMoney(n){
  var v = Number(n); if(!isFinite(v)) v = 0;
  return (v < 0 ? '-' : '') + '¥' + Math.abs(v).toFixed(2);
}
/* 宽松解析金额：支持全角数字、带 ¥ / 逗号 / 空格 */
function parseNum(v){
  if(v === null || v === undefined) return 0;
  var s = String(v).trim();
  if(!s) return 0;
  s = s.replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 65248); });
  s = s.replace(/[，,¥￥\s]/g, '');
  var n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function todayStr(){
  /* 自动化测试可以设置 window.__todayOverride 固定“今天” */
  if(window.__todayOverride) return String(window.__todayOverride);
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function plusDays(dateStr, n){
  var d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/* 起止日期都算在内 */
function daysBetween(a, b){
  if(!a || !b) return 0;
  var d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  if(isNaN(d1.getTime()) || isNaN(d2.getTime())) return 0;
  return Math.round((d2 - d1) / 86400000) + 1;
}
function toast(msg){
  var host = document.getElementById('toastHost');
  if(!host) return;
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 1800);
}

/* ================= 存储层 ================= */
function ensureStateShape(s){
  if(!s || typeof s !== 'object') return null;
  if(!Array.isArray(s.periods)) s.periods = [];
  if(!Array.isArray(s.accounts) || !s.accounts.length) s.accounts = DEFAULT_ACCOUNTS.map(function(a){ return {id:a.id, name:a.name}; });
  if(!Array.isArray(s.categoriesExpense) || !s.categoriesExpense.length) s.categoriesExpense = DEFAULT_EXPENSE_CATS.map(function(c){ return Object.assign({}, c); });
  if(!Array.isArray(s.categoriesIncome) || !s.categoriesIncome.length) s.categoriesIncome = DEFAULT_INCOME_CATS.map(function(c){ return Object.assign({}, c); });
  s.periods.forEach(function(p){
    if(!p.openingBalances || typeof p.openingBalances !== 'object') p.openingBalances = {};
    if(!Array.isArray(p.records)) p.records = [];
    /* 账户按账簿独立：老账期没有 p.accounts 就从总表抄一份（各账簿各一份，之后互不影响） */
    if(!Array.isArray(p.accounts) || !p.accounts.length){
      var srcAccts = (Array.isArray(s.accounts) && s.accounts.length) ? s.accounts : DEFAULT_ACCOUNTS;
      p.accounts = srcAccts.map(function(a){ return { id: a.id, name: a.name }; });
    }
    p.records.forEach(function(r){
      r.amount = round2(r.amount);
      if(!r.date) r.date = todayStr();
      if(!r.createdAt) r.createdAt = Date.now();
    });
  });
  /* 分类预算字段归一化：老数据只有 budget，按固定总额处理 */
  s.categoriesExpense.forEach(function(c){
    if(c.budgetMode !== 'periodic') c.budgetMode = 'fixed';
    c.budget = round2(c.budget);
    c.unitPrice = round2(c.unitPrice);
    c.everyDays = Number(c.everyDays) || 0;
  });
  /* 卫生巾不再作为默认分类：没有任何记录用它就清掉（有记录则保留，避免变未分类） */
  var tamponUsed = s.periods.some(function(p){
    return (p.records || []).some(function(r){ return r.categoryId === 'c_tampon'; });
  });
  if(!tamponUsed){
    s.categoriesExpense = s.categoriesExpense.filter(function(c){ return c.id !== 'c_tampon'; });
    s.periods.forEach(function(p){ if(p.catPlans) delete p.catPlans['c_tampon']; });
  }
  /* 预算迁移：用 p.planInit 标记"这个账簿的预算已初始化过"。
   * 没有标记的老账期里，只给最早的第一个账簿抄一份分类上的预算，
   * 其余（后来新建的账簿）从 0 开始，不继承上一个账簿 */
  var earliest = s.periods.slice().sort(function(x, y){
    return (Number(x.createdAt) || 0) - (Number(y.createdAt) || 0);
  })[0];
  var catHasBudget = s.categoriesExpense.some(function(c){
    return (Number(c.budget) || 0) > 0 || (Number(c.unitPrice) || 0) > 0;
  });
  s.periods.forEach(function(p){
    if(p.planInit) return;
    p.catPlans = (p.catPlans && typeof p.catPlans === 'object') ? p.catPlans : {};
    if(p === earliest && catHasBudget){
      s.categoriesExpense.forEach(function(c){
        p.catPlans[c.id] = {
          budget: round2(c.budget),
          budgetMode: c.budgetMode,
          unitPrice: round2(c.unitPrice),
          everyDays: Number(c.everyDays) || 0
        };
      });
    }
    p.planInit = true;
  });
  return s;
}
/* 预算快照：每次保存时，如果当前账簿有预算，就留一份备份。
 * 预算被误清空时可以一键还原（只还原当前账簿） */
var BUDGET_BAK_KEY = 'personal_ledger_budget_bak_v1';
function budgetTotalOf(p){
  var t = 0;
  Object.keys((p && p.catPlans) || {}).forEach(function(k){
    var e = p.catPlans[k] || {};
    if((Number(e.budget) || 0) > 0 || (Number(e.unitPrice) || 0) > 0) t++;
  });
  return t;
}
function budgetSnapshot(){
  var p = getActivePeriod();
  if(!p || budgetTotalOf(p) <= 0) return;
  try{
    var raw = localStorage.getItem(BUDGET_BAK_KEY);
    var all = raw ? JSON.parse(raw) : {};
    if(!Array.isArray(all[p.id])) all[p.id] = [];
    var json = JSON.stringify(p.catPlans);
    var last = all[p.id][all[p.id].length - 1];
    if(last && JSON.stringify(last.plans) === json) return;
    all[p.id].push({ at: Date.now(), plans: JSON.parse(json) });
    if(all[p.id].length > 4) all[p.id] = all[p.id].slice(-4);
    localStorage.setItem(BUDGET_BAK_KEY, JSON.stringify(all));
  }catch(e){}
}
function budgetSnapshotCount(pid){
  try{
    var raw = localStorage.getItem(BUDGET_BAK_KEY);
    var all = raw ? JSON.parse(raw) : {};
    return (all[pid] || []).length;
  }catch(e){ return 0; }
}
function restoreBudgetSnapshot(){
  var p = getActivePeriod();
  if(!p) return 0;
  try{
    var raw = localStorage.getItem(BUDGET_BAK_KEY);
    var all = raw ? JSON.parse(raw) : {};
    var list = all[p.id] || [];
    if(!list.length) return -1;
    var snap = list[list.length - 1].plans;
    p.catPlans = JSON.parse(JSON.stringify(snap));
    p.planInit = true;
    state.categoriesExpense.forEach(function(c){
      var e = p.catPlans[c.id];
      if(!e) return;
      c.budget = round2(e.budget);
      c.budgetMode = e.budgetMode === 'periodic' ? 'periodic' : 'fixed';
      c.unitPrice = round2(e.unitPrice);
      c.everyDays = Number(e.everyDays) || 0;
    });
    saveAll();
    return Object.keys(p.catPlans).length;
  }catch(e){ return 0; }
}
function saveAll(){
  try{
    state.activePeriodId = activePeriodId;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.warn('保存失败', e); toast('本地保存失败'); }
  try{ budgetSnapshot(); }catch(e){}
}
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return ensureStateShape(JSON.parse(raw));
  }catch(e){ console.warn('读取失败', e); return null; }
}

/* ================= 数据计算 ================= */
function getActivePeriod(){
  if(!state) return null;
  return state.periods.filter(function(p){ return p.id === activePeriodId; })[0] || null;
}
function computeAccountBalance(acctId){
  var p = getActivePeriod();
  if(!p) return 0;
  var bal = parseNum((p.openingBalances || {})[acctId]);
  (p.records || []).forEach(function(r){
    if(r.accountId === acctId){
      if(r.type === 'income') bal += Number(r.amount || 0);
      else bal -= Number(r.amount || 0);
    }
  });
  return round2(bal);
}
function computePeriodStats(){
  var p = getActivePeriod();
  if(!p) return { start:0, income:0, expense:0, balance:0 };
  var start = 0;
  Object.keys(p.openingBalances || {}).forEach(function(k){ start += parseNum(p.openingBalances[k]); });
  var income = 0, expense = 0;
  (p.records || []).forEach(function(r){
    if(r.type === 'income') income += Number(r.amount || 0);
    else expense += Number(r.amount || 0);
  });
  return {
    start: round2(start),
    income: round2(income),
    expense: round2(expense),
    balance: round2(start + income - expense)
  };
}
function computeCategoryTotals(){
  var p = getActivePeriod(); if(!p) return {};
  var map = {};
  (p.records || []).forEach(function(r){
    if(r.type === 'expense') map[r.categoryId] = round2((map[r.categoryId] || 0) + Number(r.amount || 0));
  });
  return map;
}

/* ================= 预算计算 =================
 * 两种模式：
 *  fixed    —— 直接给本期一个总额
 *  periodic —— 每次金额 + 每几天一次
 *              本期预算 = 本期天数 ÷ 间隔天数 × 每次金额
 */
function periodDays(p){
  p = p || getActivePeriod();
  if(!p) return 0;
  return Math.max(0, daysBetween(p.startDate, p.endDate));
}
function budgetModeOf(c){
  if(!c) return 'fixed';
  return (catPlanOf(c.id).budgetMode === 'periodic') ? 'periodic' : 'fixed';
}
/* 预算按账期独立：每个账期在 p.catPlans[catId] 里存自己的一份，
 * 新建账期不继承上一个账期的预算；老账期在加载时抄一次分类上的预算 */
function catPlanOf(catId){
  var p = getActivePeriod();
  if(!p) return { budget:0, budgetMode:'fixed', unitPrice:0, everyDays:0 };
  if(!p.catPlans || typeof p.catPlans !== 'object') p.catPlans = {};
  var e = p.catPlans[catId];
  if(!e){
    e = { budget:0, budgetMode:'fixed', unitPrice:0, everyDays:0 };
    p.catPlans[catId] = e;
  }
  return e;
}
/* 预算写完把值镜像回分类对象：只给导出/兼容用，读一律走 catPlanOf */
function mirrorPlanToCat(catId){
  var e = null;
  var p = getActivePeriod();
  if(p && p.catPlans) e = p.catPlans[catId];
  if(!e) return;
  if(p) p.planInit = true;   /* 本账簿的预算被人手动改过了 */
  var c = (state.categoriesExpense || []).filter(function(x){ return x.id === catId; })[0];
  if(!c) return;
  c.budget = round2(e.budget);
  c.budgetMode = e.budgetMode === 'periodic' ? 'periodic' : 'fixed';
  c.unitPrice = round2(e.unitPrice);
  c.everyDays = Number(e.everyDays) || 0;
}
function effectiveBudget(c, days){
  if(!c) return 0;
  var pl = catPlanOf(c.id);
  if((pl.budgetMode === 'periodic') ? true : false){
    var unit = Number(pl.unitPrice) || 0;
    var every = Number(pl.everyDays) || 0;
    if(unit <= 0 || days <= 0) return 0;
    /* everyDays === -1 表示"整个账期一次"，不随天数变化 */
    if(every === -1) return round2(unit);
    if(every <= 0) return 0;
    return round2(days / every * unit);
  }
  return round2(pl.budget);
}
/* 周期模式下的次数：本期天数 ÷ 间隔 */
function budgetTimes(c, days){
  var every = Number(catPlanOf(c.id).everyDays) || 0;
  if(every === -1) return 1;
  if(every <= 0 || days <= 0) return 0;
  return round2(days / every);
}

/* ===== 频率预算：按段累计的「还能花」 ===== */
/* 某分类在 [fromDate, toDate] 之间的支出合计（按记录日期） */
function sumCategorySpent(catId, fromDate, toDate, ignoreId){
  var p = getActivePeriod(); if(!p) return 0;
  var s = 0;
  (p.records || []).forEach(function(r){
    if(r.type !== 'expense' || r.categoryId !== catId) return;
    if(ignoreId && r.id === ignoreId) return;
    if(!r.date) return;
    if(fromDate && r.date < fromDate) return;
    if(toDate && r.date > toDate) return;
    s += Number(r.amount || 0);
  });
  return round2(s);
}
/* 频率预算在某一天的状态
 * quota     —— 从账期第一天到这一天，本该有的额度（累计额度）
 * spent     —— 同期已经花掉的钱
 * available —— quota − spent（可以为负，表示超了）
 * carry     —— 今天这一段之前攒下的余量（可以为负）
 * 这样没花完的自动带到后面，超支的自动往后面扣，不用另存字段 */
function freqStatus(c, dateStr){
  var p = getActivePeriod();
  if(!p || !c) return null;
  if(budgetModeOf(c) !== 'periodic') return null;
  var pl = catPlanOf(c.id);
  var unit = round2(pl.unitPrice);
  var every = Number(pl.everyDays) || 0;
  if(unit <= 0) return null;
  if(every === 0 || every < -1) return null;
  var d = String(dateStr || todayStr()).slice(0, 10);
  if(d < p.startDate) return { unit:unit, every:every, before:true, carry:0, available:0, spentSeg:0, after:false };
  var clip = d > p.endDate ? p.endDate : d;
  var after = d > p.endDate;
  var n = Math.max(1, daysBetween(p.startDate, clip));
  var quota, spent, carry, segStart, segEnd, spentSeg;
  if(every === -1){
    quota = unit;
    spent = sumCategorySpent(c.id, p.startDate, clip);
    segStart = p.startDate; segEnd = clip;
    spentSeg = spent;
    carry = 0;
  }else{
    var inSeg = ((n - 1) % every) + 1;          /* 今天这一段已经走到第几天 */
    var beforeDays = n - inSeg;                 /* 这一段之前一共有几天 */
    var beforeQuota = beforeDays > 0 ? round2(beforeDays / every * unit) : 0;
    /* 当前这一段的单价一开始就整笔给满，最后一段不满时按整期预算封顶 */
    quota = round2(beforeQuota + unit);
    var cap = effectiveBudget(c, periodDays(p));
    if(cap > 0 && quota > cap) quota = cap;
    spent = sumCategorySpent(c.id, p.startDate, clip);
    segStart = plusDays(p.startDate, beforeDays);
    segEnd = clip;
    carry = beforeDays > 0
      ? round2(beforeQuota - sumCategorySpent(c.id, p.startDate, plusDays(segStart, -1)))
      : 0;
    spentSeg = sumCategorySpent(c.id, segStart, segEnd);
  }
  return {
    unit:unit, every:every, n:n, quota:quota, spent:spent,
    available:round2(quota - spent), carry:carry, spentSeg:spentSeg,
    segStart:segStart, after:after, before:false
  };
}
/* 分类页/弹窗用的一句话 */
function freqStatusText(st, extra){
  if(!st || st.before || st.after) return '';
  var isDaily = Number(st.every) === 1;
  var label = isDaily ? '今天还能花 ' : '这一次还能花 ';
  var avail = round2(st.available - (Number(extra) || 0));
  if(avail < 0) return label + fmtMoney(0) + '（前面超了 ' + fmtMoney(-avail) + '）';
  var carryTxt = st.carry > 0 ? '（含攒下 ' + fmtMoney(st.carry) + '）' : '';
  return label + fmtMoney(avail) + carryTxt;
}

/* 预算执行情况
 * total     —— 预算总额
 * used      —— 已经花掉、且落在预算内的部分（超支时按预算封顶）
 * remaining —— 待用预算：还没花的额度（Σ 预算 − 已花，负数记 0）
 * over      —— 超预算的部分（超出预算后，这笔钱只能从结余里硬扣）
 * 关键：预算里"已花"的部分已经在结余里扣过一次了，
 *       所以算自由支配时只能扣 remaining，不能整块扣 total。
 */
function computeBudgetPlan(){
  var p = getActivePeriod();
  if(!p) return { total:0, used:0, remaining:0, over:0, budgetedCount:0 };
  var days = periodDays(p);
  var totals = computeCategoryTotals();
  var total = 0, used = 0, remaining = 0, over = 0, count = 0;
  state.categoriesExpense.forEach(function(c){
    var b = effectiveBudget(c, days);
    if(b <= 0) return;
    count++;
    var spent = Number(totals[c.id] || 0);
    total += b;
    used += Math.min(spent, b);
    remaining += Math.max(0, b - spent);
    over += Math.max(0, spent - b);
  });
  return {
    total: round2(total),
    used: round2(used),
    remaining: round2(remaining),
    over: round2(over),
    budgetedCount: count
  };
}

/* 自由支配 = 结余 − 待用预算 */
function freeTopHint(){
  var p = getActivePeriod();
  if(!p) return '';
  var days = periodDays(p);
  var totals = computeCategoryTotals();
  var items = state.categoriesExpense.map(function(c){
    var b = effectiveBudget(c, days);
    var spent = Number(totals[c.id] || 0);
    return { name: c.name, left: round2(Math.max(0, b - spent)) };
  }).filter(function(x){ return x.left > 0.005; })
    .sort(function(a, b){ return b.left - a.left; });
  if(!items.length) return '';
  return '（其中 ' + items[0].name + ' ' + fmtMoney(items[0].left) + ' 还没动）';
}
function computeFreeMoney(){
  var s = computePeriodStats();
  var plan = computeBudgetPlan();
  return {
    balance: s.balance,
    plan: plan,
    free: round2(s.balance - plan.remaining)
  };
}

/* =========================================================
 *  Wizard 通用弹窗（每次重新创建，避免残留状态 / 重复绑定）
 * ========================================================= */
var _wizardMask = null;
var _wizardOnClose = null;

function closeWizard(silent){
  if(_wizardMask && _wizardMask.parentNode){
    _wizardMask.parentNode.removeChild(_wizardMask);
  }
  _wizardMask = null;
  var cb = _wizardOnClose;
  _wizardOnClose = null;
  if(!silent && typeof cb === 'function') cb();
}

function openWizard(opt){
  closeWizard(true);
  opt = opt || {};

  var mask = document.createElement('div');
  mask.className = 'wizard-mask' + (opt.center ? ' center' : '');
  mask.innerHTML =
    '<div class="wizard">' +
      '<div class="wizard-header">' +
        '<div>' +
          '<div class="wizard-title">' + escapeHtml(opt.title || '') + '</div>' +
          (opt.stepInfo ? '<div class="wizard-step">' + escapeHtml(opt.stepInfo) + '</div>' : '') +
        '</div>' +
        '<button type="button" class="btn-ghost" data-close>✕</button>' +
      '</div>' +
      '<div class="wizard-body"></div>' +
      '<div class="wizard-footer"></div>' +
    '</div>';

  document.body.appendChild(mask);
  _wizardMask = mask;
  _wizardOnClose = typeof opt.onClose === 'function' ? opt.onClose : null;

  var root = mask.querySelector('.wizard');
  var body = root.querySelector('.wizard-body');
  var footer = root.querySelector('.wizard-footer');

  body.innerHTML = opt.body || '';

  root.querySelector('[data-close]').addEventListener('click', function(){ closeWizard(); });
  mask.addEventListener('click', function(e){
    if(e.target === mask) closeWizard();
  });

  var buttons = opt.buttons || [];
  if(!buttons.length){ footer.style.display = 'none'; }
  buttons.forEach(function(b){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = b.cls || 'btn btn-outline';
    btn.textContent = b.label;
    btn.addEventListener('click', function(e){
      e.preventDefault();
      e.stopPropagation();
      if(typeof b.onClick === 'function') b.onClick();
    });
    footer.appendChild(btn);
  });

  return { mask:mask, root:root, body:body, footer:footer };
}

/* =========================================================

      stepInfo: '步骤 2/2',
      body:
        '<div class="step-hint"><b>第 2 步：填写期初各账户余额</b><br>' +
          (isEdit
            ? '修改各账户在账期开始时的余额（会影响结余和账户余额），没有就留空或填 0。</div>'
            : '输入每个账户在账期开始时的金额，没有就留空或填 0。</div>') +
        editInfoHtml() +
        '<div id="saList"></div>' +
        '<button type="button" class="btn btn-outline btn-block btn-sm mt-8" id="saAdd">+ 新增账户</button>' +
        '<div class="text-center fw-600 mt-16" style="color:var(--mint-700)">' +
          '期初总额合计：<span id="saTotal">¥0.00</span></div>',
      buttons: [
        { label:'← 上一步', cls:'btn btn-outline', onClick: goStep1 },
        { label: isEdit ? '保存修改' : (isFirst ? '开始记账' : '创建账期'), cls:'btn btn-primary', onClick: finish }
      ]
    });

    var addBtn = ui.root.querySelector('#saAdd');
    if(addBtn){
      addBtn.addEventListener('click', function(){
        var id = uid('a');
        removedAccts = removedAccts.filter(function(x){ return x !== id; });
        baseList.push({ id:id, name:'新账户' });
        setup.openingBalances[id] = 0;
        renderSaList();
      });
    }
    renderSaList();
  }

  function renderSaList(){
    var wrap = ui.root.querySelector('#saList');
    if(!wrap) return;
    wrap.innerHTML = '';
    baseList.forEach(function(a){
      if(removedAccts.indexOf(a.id) >= 0) return;
      var row = document.createElement('div');
      row.className = 'setup-acct';

      var nameI = document.createElement('input');
      nameI.className = 'form-input name';
      nameI.value = a.name || '';
      nameI.addEventListener('input', function(){ a.name = nameI.value; });

      var amtI = document.createElement('input');
      amtI.className = 'form-input amount';
      amtI.inputMode = 'decimal';
      amtI.placeholder = '0.00';
      var cur = parseNum(setup.openingBalances[a.id]);
      amtI.value = cur > 0 ? cur.toFixed(2) : '';
      amtI.addEventListener('input', function(){
        setup.openingBalances[a.id] = parseNum(amtI.value);
        updateTotal();
      });

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn-ghost btn-tiny text-danger';
      delBtn.textContent = '删';
      delBtn.addEventListener('click', function(){
        if(baseList.length - removedAccts.length <= 1){ toast('至少保留一个账户'); return; }
        if(removedAccts.indexOf(a.id) < 0) removedAccts.push(a.id);
        delete setup.openingBalances[a.id];
        renderSaList();
      });

      row.appendChild(nameI);
      row.appendChild(amtI);
      row.appendChild(delBtn);
      wrap.appendChild(row);
    });
    updateTotal();
  }

  function updateTotal(){
    var el = ui.root.querySelector('#saTotal');
    if(el) el.textContent = fmtMoney(openingTotal());
  }

  /* 编辑模式下的提示：已有记录、有多少会落在新范围外 */
  function editInfoHtml(){
    if(!isEdit) return '';
    var recs = editing.records || [];
    var out = recs.filter(function(r){
      return String(r.date || '') < setup.startDate || String(r.date || '') > setup.endDate;
    }).length;
    var txt = '该账期已有 ' + recs.length + ' 条记录';
    if(out > 0) txt += '，其中 ' + out + ' 条日期不在新的账期范围内（仍保留在这个账期里）';
    return '<div class="text-muted" style="font-size:12px;margin-bottom:12px">' + txt + '。</div>';
  }

  function finish(){
    var name = String(setup.name || '').trim() || (setup.startDate + ' ~ ' + setup.endDate);

    /* 编辑已有账期：只改名称/日期/期初余额，记录原样保留 */
    if(isEdit){
      editing.name = name;
      editing.startDate = setup.startDate;
      editing.endDate = setup.endDate;
      editing.openingBalances = {};
      editing.accounts = [];
      baseList.forEach(function(a){
        if(removedAccts.indexOf(a.id) >= 0) return;
        editing.openingBalances[a.id] = parseNum(setup.openingBalances[a.id]);
        editing.accounts.push({ id: a.id, name: String(a.name || '').trim() || '未命名账户' });
      });
      /* 从本账簿移除的账户：只删本账簿的期初和本账簿的记录 */
      removedAccts.forEach(function(id){
        delete editing.openingBalances[id];
        editing.records = (editing.records || []).filter(function(r){ return r.accountId !== id; });
      });
      saveAll();
      closeWizard(true);
      toast('账期已更新');
      render();
      return;
    }

    var period = {
      id: uid('p'),
      name: name,
      startDate: setup.startDate,
      endDate: setup.endDate,
      openingBalances: {},
      records: [],
      accounts: [],        /* 本账簿自己的账户清单，和别的账簿互不影响 */
      catPlans: {},   /* 新账期预算从 0 开始，不继承第一个账簿 */
      planInit: true, /* 标记已初始化：以后加载不会被迁移逻辑重新填预算 */
      createdAt: Date.now()
    };
    baseList.forEach(function(a){
      if(removedAccts.indexOf(a.id) >= 0) return;
      period.openingBalances[a.id] = parseNum(setup.openingBalances[a.id]);
      period.accounts.push({ id: a.id, name: String(a.name || '').trim() || '未命名账户' });
    });
    if(!Object.keys(period.openingBalances).length){
      toast('至少留一个账户'); return;
    }
    state.periods.push(period);
    state.activePeriodId = period.id;
    activePeriodId = period.id;
    calFocusActive();
    saveAll();
    closeWizard(true);
    toast('账期已创建');
    render();
  }

  renderStep1();
}

/* =========================================================
 *  记一笔（支出 / 收入）向导
 * ========================================================= */
function openRecordWizard(type, editRec, presetCatId){
  if(!getActivePeriod()){ toast('请先创建账期'); return; }
  var isEdit = !!editRec;

  var rec = isEdit ? {
    id: editRec.id,
    type: editRec.type || type,
    categoryId: editRec.categoryId || '',
    amount: round2(editRec.amount),
    accountId: editRec.accountId || '',
    date: editRec.date || todayStr(),
    note: editRec.note || '',
    price: round2(editRec.price),
    qty: round2(editRec.qty),
    createdAt: editRec.createdAt || Date.now()
  } : {
    id: uid('r'),
    type: type,
    categoryId: presetCatId || '',
    amount: 0,
    accountId: (presetCatId && lastAccountForCategory(presetCatId)) || defaultAccountId() || '',
    date: todayStr(),
    note: '',
    price: 0,
    qty: 0,
    createdAt: 0
  };

  var st = {
    step: 1,
    price: rec.price,
    qty: rec.qty,
    lastEdit: (rec.price > 0 && rec.qty > 0 && Math.abs(round2(rec.price * rec.qty) - rec.amount) < 0.005)
      ? 'priceQty' : 'amount'
  };
  var ui = null;

  /* 从首页点了分类进来的：直接跳到填金额那一步 */
  if(!isEdit && presetCatId){
    var presetOk = (rec.type === 'expense' ? state.categoriesExpense : state.categoriesIncome)
      .some(function(c){ return c.id === presetCatId; });
    if(presetOk) st.step = 2;
  }

  function titleText(){
    return (rec.type === 'expense' ? '记一笔支出' : '记一笔收入') + (isEdit ? ' · 修改' : '');
  }
  function catList(){
    return rec.type === 'expense' ? state.categoriesExpense : state.categoriesIncome;
  }

  /* ---------- 第 1 步：选择分类 ---------- */
  function step1(){
    ui = openWizard({
      title: titleText(),
      stepInfo: '步骤 1/4',
      body:
        '<div class="step-hint"><b>第 1 步：选择' + (rec.type === 'expense' ? '分类' : '来源') + '</b></div>' +
        '<div class="cat-grid" id="catGrid"></div>',
      buttons: [
        { label:'下一步 →', cls:'btn btn-primary', onClick: next }
      ]
    });
    var grid = ui.root.querySelector('#catGrid');
    catList().forEach(function(c){ grid.appendChild(makeCatItem(c)); });
    var addBtn = document.createElement('div');
    addBtn.className = 'cat-add';
    addBtn.textContent = rec.type === 'expense' ? '+ 新增分类' : '+ 新增来源';
    addBtn.addEventListener('click', function(e){ e.stopPropagation(); addCat(); });
    grid.appendChild(addBtn);
  }

  function makeCatItem(c){
    var el = document.createElement('div');
    el.className = 'cat-item' + (rec.categoryId === c.id ? ' selected' : '');
    el.setAttribute('data-cat', c.id);
    el.innerHTML =
      (rec.type === 'expense' && c.emoji ? '<span class="emoji">' + escapeHtml(c.emoji) + '</span>' : '') +
      escapeHtml(c.name);
    el.addEventListener('click', function(e){
      /* 只切选中态，不重建弹窗 —— 这是"选完又弹一次"的根治办法 */
      e.stopPropagation();
      e.preventDefault();
      rec.categoryId = c.id;
      /* 这个分类上次用的账户，自动帮用户选上（还是能改） */
      if(!isEdit){
        var memoAcct = lastAccountForCategory(c.id);
        if(memoAcct) rec.accountId = memoAcct;
      }
      var grid = ui.root.querySelector('#catGrid');
      if(grid){
        Array.prototype.forEach.call(grid.querySelectorAll('.cat-item'), function(x){
          x.classList.toggle('selected', x.getAttribute('data-cat') === c.id);
        });
      }
    });
    return el;
  }

  function addCat(){
    var input = window.prompt('输入新的分类名称：');
    if(input === null) return;
    var nm = String(input).trim();
    if(!nm) return;
    var id = rec.type === 'expense' ? uid('c') : uid('i');
    var cat = rec.type === 'expense' ? { id:id, emoji:'📌', name:nm, budget:0 } : { id:id, name:nm };
    if(rec.type === 'expense') state.categoriesExpense.push(cat);
    else state.categoriesIncome.push(cat);
    saveAll();
    rec.categoryId = id;
    /* 局部插入，不重建向导 */
    var grid = ui.root.querySelector('#catGrid');
    if(grid){
      var addBtn = grid.querySelector('.cat-add');
      var el = makeCatItem(cat);
      if(addBtn) grid.insertBefore(el, addBtn);
      else grid.appendChild(el);
      Array.prototype.forEach.call(grid.querySelectorAll('.cat-item'), function(x){
        x.classList.toggle('selected', x.getAttribute('data-cat') === id);
      });
    }
    toast('已添加：' + nm);
  }

  /* ---------- 第 2 步：金额 ---------- */
  function step2(){
    var amtVal = rec.amount > 0 ? rec.amount.toFixed(2) : '';
    var pVal = st.price > 0 ? String(st.price) : '';
    var qVal = st.qty > 0 ? String(st.qty) : '';

    ui = openWizard({
      title: titleText(),
      stepInfo: '步骤 2/4',
      body:
        '<div class="step-hint"><b>第 2 步：输入金额</b><br>' +
          '两种填法二选一：直接填「总价」，或者填「单价 × 次数」自动算总价。<br>' +
          '两个都填时，以你最后改动的那个为准。</div>' +
        '<div class="form-group">' +
          '<label class="form-label">总价 <span class="text-muted">(元)</span></label>' +
          '<input class="form-input amount" id="r_amount" inputmode="decimal" placeholder="0.00" value="' + amtVal + '">' +
        '</div>' +
        '<div class="text-center text-muted" style="font-size:13px;margin:4px 0">—— 或 ——</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label class="form-label">单价</label>' +
            '<input class="form-input" id="r_price" inputmode="decimal" placeholder="0.00" value="' + pVal + '"></div>' +
          '<div class="form-group"><label class="form-label">次数</label>' +
            '<input class="form-input" id="r_qty" inputmode="decimal" placeholder="0" value="' + qVal + '"></div>' +
        '</div>' +
        '<div class="text-muted text-center" id="calcHint" style="min-height:22px"></div>',
      buttons: [
        { label:'← 上一步', cls:'btn btn-outline', onClick: prev },
        { label:'下一步 →', cls:'btn btn-primary', onClick: next }
      ]
    });

    var amtEl = ui.root.querySelector('#r_amount');
    var pEl = ui.root.querySelector('#r_price');
    var qEl = ui.root.querySelector('#r_qty');

    /* 只填总价 */
    amtEl.addEventListener('input', function(){
      rec.amount = parseNum(amtEl.value);
      st.lastEdit = 'amount';
      updateHint();
    });
    amtEl.addEventListener('blur', function(){
      if(rec.amount > 0) amtEl.value = rec.amount.toFixed(2);
    });

    /* 填单价 × 次数 → 自动写回总价 */
    function fromPriceQty(){
      st.price = parseNum(pEl.value);
      st.qty = parseNum(qEl.value);
      st.lastEdit = 'priceQty';
      rec.amount = (st.price > 0 && st.qty > 0) ? round2(st.price * st.qty) : 0;
      amtEl.value = rec.amount > 0 ? rec.amount.toFixed(2) : '';
      updateHint();
    }
    pEl.addEventListener('input', fromPriceQty);
    qEl.addEventListener('input', fromPriceQty);

    updateHint();

    function updateHint(){
      var el = ui.root.querySelector('#calcHint');
      if(!el) return;
      if(st.lastEdit === 'priceQty'){
        if(st.price > 0 && st.qty > 0){
          el.innerHTML = fmtMoney(st.price) + ' × ' + st.qty + ' = <b>' + fmtMoney(rec.amount) + '</b>（已自动填入总价）';
        }else{
          el.textContent = '填好单价和次数后会自动算出总价';
        }
      }else if(rec.amount > 0){
        el.innerHTML = '当前总价：<b>' + fmtMoney(rec.amount) + '</b>';
      }else{
        el.textContent = '';
      }
    }
  }

  /* ---------- 第 3 步：账户 ---------- */
  function step3(){
    ui = openWizard({
      title: titleText(),
      stepInfo: '步骤 3/4',
      body:
        '<div class="step-hint"><b>第 3 步：' + (rec.type === 'expense' ? '从哪个账户扣款' : '入到哪个账户') + '</b></div>' +
        '<div class="acct-chips" id="acctChips"></div>' +
        '<div class="text-muted mt-12" id="acctCurBal"></div>',
      buttons: [
        { label:'← 上一步', cls:'btn btn-outline', onClick: prev },
        { label:'下一步 →', cls:'btn btn-primary', onClick: next }
      ]
    });

    var chips = ui.root.querySelector('#acctChips');
    accountsOf(getActivePeriod()).forEach(function(a){
      var el = document.createElement('div');
      el.className = 'acct-chip' + (rec.accountId === a.id ? ' selected' : '');
      el.setAttribute('data-acct', a.id);
      el.textContent = a.name;
      el.addEventListener('click', function(e){
        e.stopPropagation();
        rec.accountId = a.id;
        Array.prototype.forEach.call(chips.querySelectorAll('.acct-chip'), function(x){
          x.classList.toggle('selected', x.getAttribute('data-acct') === a.id);
        });
        showBal();
      });
      chips.appendChild(el);
    });
    showBal();

    function showBal(){
      var el = ui.root.querySelector('#acctCurBal');
      if(!el) return;
      var a = acctById(rec.accountId);
      el.textContent = a ? '当前 ' + a.name + ' 余额：' + fmtMoney(computeAccountBalance(a.id)) : '';
    }
  }

  /* ---------- 第 4 步：日期 / 备注 ---------- */
  function step4(){
    var cat = catList().filter(function(c){ return c.id === rec.categoryId; })[0];
    var acct = acctById(rec.accountId);

    ui = openWizard({
      title: titleText(),
      stepInfo: '步骤 4/4',
      body:
        '<div class="step-hint"><b>第 4 步：日期和备注（可选）</b></div>' +
        '<div class="form-group"><label class="form-label">日期</label>' +
          '<input class="form-input" id="r_date" type="date" value="' + (rec.date || todayStr()) + '"></div>' +
        '<div class="form-group"><label class="form-label">备注</label>' +
          '<input class="form-input" id="r_note" placeholder="可选，例如 和朋友聚餐" value="' + escapeHtml(rec.note) + '"></div>' +
        '<div class="text-muted mt-12 text-center">摘要：' +
          (rec.type === 'expense' ? '支出' : '收入') + ' · ' +
          escapeHtml(cat ? cat.name : '—') + ' · ' +
          (rec.amount > 0 ? fmtMoney(rec.amount) : '—') + ' · ' +
          escapeHtml(acct ? acct.name : '—') +
        '</div>',
      buttons: [
        { label:'← 上一步', cls:'btn btn-outline', onClick: prev },
        { label: isEdit ? '保存修改' : '保存', cls:'btn btn-primary', onClick: save }
      ]
    });

    var dateEl = ui.root.querySelector('#r_date');
    var noteEl = ui.root.querySelector('#r_note');
    if(dateEl) dateEl.addEventListener('change', function(){ rec.date = dateEl.value || todayStr(); });
    if(noteEl) noteEl.addEventListener('input', function(){ rec.note = noteEl.value; });
  }

  /* ---------- 上一步 / 下一步 ---------- */
  function capture(){
    if(!ui || !ui.root) return;
    var a = ui.root.querySelector('#r_amount'); if(a) rec.amount = parseNum(a.value);
    var p = ui.root.querySelector('#r_price');  if(p) st.price = parseNum(p.value);
    var q = ui.root.querySelector('#r_qty');    if(q) st.qty = parseNum(q.value);
    var d = ui.root.querySelector('#r_date');   if(d && d.value) rec.date = d.value;
    var n = ui.root.querySelector('#r_note');   if(n) rec.note = n.value;
  }

  function next(){
    capture();
    if(st.step === 1 && !rec.categoryId){ toast('请先选择一个分类'); return; }
    if(st.step === 2 && !(rec.amount > 0)){ toast('请填写金额（必须大于 0）'); return; }
    if(st.step === 3 && !rec.accountId){ toast('请先选择一个账户'); return; }
    if(st.step >= 4) return;
    st.step = st.step + 1;
    renderStep();
  }

  function prev(){
    capture();
    if(st.step <= 1) return;
    st.step = st.step - 1;
    renderStep();
  }

  /* ---------- 保存 ---------- */
  function save(){
    capture();
    rec.amount = round2(rec.amount);
    if(!(rec.amount > 0)){ toast('金额必须大于 0'); return; }
    if(!rec.categoryId){ toast('请选择分类'); st.step = 1; renderStep(); return; }
    rec.price = round2(st.price);
    rec.qty = round2(st.qty);
    rec.note = String(rec.note || '').trim();
    if(!rec.date) rec.date = todayStr();
    if(!rec.createdAt) rec.createdAt = Date.now();

    var p = getActivePeriod();
    if(isEdit){
      var idx = p.records.findIndex(function(r){ return r.id === rec.id; });
      if(idx >= 0) p.records[idx] = rec;
      else p.records.push(rec);
    }else{
      p.records.push(rec);
    }
    rememberAccount(rec.categoryId, rec.accountId);
    if(rec.accountId) state.lastAccountId = rec.accountId;
    saveAll();
    closeWizard(true);
    toast(isEdit ? '已保存修改' : '✓ 已记账');
    render();
  }

  function renderStep(){
    if(st.step === 1) return step1();
    if(st.step === 2) return step2();
    if(st.step === 3) return step3();
    return step4();
  }

  renderStep();
}

/* ================= 记录编辑 / 删除 ================= */
function editRecord(id){
  var p = getActivePeriod(); if(!p) return;
  var r = p.records.filter(function(x){ return x.id === id; })[0];
  if(r) openRecordWizard(r.type, r);
}
function deleteRecord(id){
  var p = getActivePeriod(); if(!p) return;
  if(!confirm('确定删除这条记录吗？')) return;
  p.records = p.records.filter(function(r){ return r.id !== id; });
  saveAll();
  toast('已删除');
  render();
}

/* =========================================================
 *  主界面渲染
 * ========================================================= */
function render(){
  var p = getActivePeriod();
  var titleEl = document.getElementById('periodTitle');
  var subEl = document.getElementById('periodSub');

  if(!p){
    titleEl.textContent = '个人记账';
    subEl.textContent = '还没有账期，点右上角 📅 创建';
    ['kpiStart','kpiIncome','kpiExpense','kpiBalance','kpiFree'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.textContent = '¥0.00';
    });
    document.getElementById('kpiBalanceCard').classList.remove('negative');
    document.getElementById('kpiFreeCard').classList.remove('negative');
    document.getElementById('kpiFreeMeta').textContent = '结余 − 待用预算';
    ['accountList','recordList','categoryList','summaryContent'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.innerHTML = '<div class="empty">还没有账期</div>';
    });
    ['catSummaryFold','budgetFold'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.innerHTML = '';
    });
    return;
  }

  titleEl.textContent = p.name || ('账期 · ' + p.startDate);
  subEl.textContent = p.startDate + ' ~ ' + p.endDate + ' · 共 ' + daysBetween(p.startDate, p.endDate) + ' 天';

  var s = computePeriodStats();
  document.getElementById('kpiStart').textContent  = fmtMoney(s.start);
  document.getElementById('kpiIncome').textContent = fmtMoney(s.income);
  document.getElementById('kpiExpense').textContent = fmtMoney(s.expense);
  document.getElementById('kpiBalance').textContent = fmtMoney(s.balance);
  document.getElementById('kpiBalanceCard').classList.toggle('negative', s.balance < 0);

  /* 自由支配 = 结余 − 待用预算（预算里还没花的那部分才需要预留） */
  var plan = computeBudgetPlan();
  var free = round2(s.balance - plan.remaining);
  document.getElementById('kpiFree').textContent = fmtMoney(free);
  document.getElementById('kpiFreeCard').classList.toggle('negative', free < 0);
  document.getElementById('kpiFreeMeta').textContent = plan.total > 0
    ? '结余 ' + fmtMoney(s.balance) + ' − 待用预算 ' + fmtMoney(plan.remaining) +
      freeTopHint() +
      (plan.over > 0 ? '（已有 ' + fmtMoney(plan.over) + ' 超预算）' : '')
    : '还没设预算，等于结余';

  renderAccounts();
  renderRecords();
  renderCategories();
  renderBudgetFold();
  renderSummary();   /* = 日历视图 */
}

/* 账户页：自由支配的预算拆解（默认收起）*/
var budgetFoldOpen = false;
function renderBudgetFold(){
  var wrap = document.getElementById('budgetFold');
  if(!wrap) return;
  var p = getActivePeriod();
  if(!p){ wrap.innerHTML = ''; return; }
  var s = computePeriodStats();
  var plan = computeBudgetPlan();
  var free = round2(s.balance - plan.remaining);
  function row(lb, val, danger){
    return '<div class="detail-row"><span>' + lb + '</span><span' + (danger ? ' class="text-danger"' : '') + '>' + val + '</span></div>';
  }
  var inner =
    row('预算总额', fmtMoney(plan.total)) +
    row('预算内已花', fmtMoney(plan.used)) +
    row('待用预算（还没花的额度）', fmtMoney(plan.remaining)) +
    (plan.over > 0 ? row('超出预算的部分', fmtMoney(plan.over), true) : '') +
    '<div class="text-muted" style="font-size:11px;margin-top:8px;line-height:1.5">已花的钱已在结余里扣过，所以只预留还没花的额度；超预算的部分直接算进支出。频率预算的可花额度逐天/逐段累计，没花完的带到下一段。</div>';
  wrap.innerHTML = '<div class="fold">' +
      '<div class="fold-head" data-fold="budget"><span>预算拆解</span>' +
        '<span class="f-r">自由支配 ' + fmtMoney(free) + ' ▾</span></div>' +
      '<div class="fold-body' + (budgetFoldOpen ? '' : ' hide') + '">' + inner + '</div>' +
    '</div>';
}

/* =========================================================
 *  一句话记账：解析 → 预览 → 落库
 *  支持 “快餐12，水果12” / “快餐 12 水果 12” / “快餐12/水果12”
 * ========================================================= */
function defaultAccountId(){
  var ids = accountsOf(getActivePeriod()).map(function(a){ return a.id; });
  if(state.lastAccountId && ids.indexOf(state.lastAccountId) >= 0) return state.lastAccountId;
  return ids[0] || null;
}

/* 每个分类记住上次用的账户：饮食→微信、交通→招商……下次点这个分类自动选上 */
function lastAccountForCategory(catId){
  if(!catId) return null;
  var map = state.lastAccountByCategory;
  if(!map || typeof map !== 'object') return null;
  var id = map[catId];
  if(!id) return null;
  var exists = accountsOf(getActivePeriod()).some(function(a){ return a.id === id; });
  return exists ? id : null;
}

function rememberAccount(catId, acctId){
  if(!catId || !acctId) return;
  if(!state.lastAccountByCategory || typeof state.lastAccountByCategory !== 'object'){
    state.lastAccountByCategory = {};
  }
  state.lastAccountByCategory[catId] = acctId;
}

function parseQuickEntries(text, fallbackName){
  var raw = String(text == null ? '' : text).trim();
  if(!raw) return [];

  var tokens = raw.split(/[\s\u00a0，,、\/|｜；;]+/).filter(function(t){ return t !== ''; });
  var out = [];
  var pendName = null;   /* 只有名字，等金额 */
  var pendAmt = null;    /* 只有金额，等名字 */

  function push(name, amt){
    var nm = String(name == null ? '' : name).trim();
    var fb = String(fallbackName == null ? '' : fallbackName).trim();
    if(!nm) nm = fb;
    if(!nm) return;                 /* 没名字又没默认分类，认不出来就跳过 */
    var v = Number(amt);
    if(!isFinite(v) || v <= 0) return;
    out.push({ name:nm, amount:round2(v), auto:!String(name == null ? '' : name).trim() });
  }

  tokens.forEach(function(tk){
    var m;

    /* 纯数字：12 / 12.5 / ¥12 / 12元 */
    if((m = tk.match(/^[¥￥]?([0-9]+(?:\.[0-9]+)?)(?:元|块|圆)?$/))){
      var v = parseFloat(m[1]);
      if(pendName !== null){ push(pendName, v); pendName = null; }
      else if(fallbackName){ push('', v); }
      else pendAmt = v;
      return;
    }

    /* 名字在前：快餐12 / 快餐 12元 */
    if((m = tk.match(/^([^\d]+?)[¥￥]?([0-9]+(?:\.[0-9]+)?)(?:元|块|圆)?$/))){
      push(m[1], parseFloat(m[2]));
      return;
    }

    /* 金额在前：12快餐 / ¥12快餐 */
    if((m = tk.match(/^[¥￥]?([0-9]+(?:\.[0-9]+)?)(?:元|块|圆)?([^\d]+)$/))){
      push(m[2], parseFloat(m[1]));
      return;
    }

    /* 纯名字 */
    var nm = tk.trim();
    if(pendAmt !== null){ push(nm, pendAmt); pendAmt = null; }
    else pendName = nm;
  });

  return out;
}

function quickFindCategory(name, type){
  var list = type === 'income' ? state.categoriesIncome : state.categoriesExpense;
  var nm = String(name || '').trim();
  if(!nm) return null;
  for(var i = 0; i < list.length; i++){
    if(String(list[i].name).trim() === nm) return list[i];
  }
  /* 名称对不上时先走别名识别（「快餐」→ 饮食、「打车」→ 交通），不要另立新分类 */
  if(type !== 'income'){
    var rec = recognizeAll(nm);
    var byRec = rec.catId ? catById(rec.catId) : null;
    if(byRec) return byRec;
    for(var j = 0; j < list.length; j++){
      var n = String(list[j].name || '').trim();
      if(n.length >= 2 && (nm.indexOf(n) >= 0 || n.indexOf(nm) >= 0)) return list[j];
    }
  }
  return null;
}
